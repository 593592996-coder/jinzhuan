<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>金砖口腔·模块五刷题</title>
<meta name="apple-mobile-web-app-title" content="金砖备赛">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--blue:#1f6f8b;--blue2:#2b8da8;--bg:#eef3f5;--card:#fff;--ok:#1a9d6b;--bad:#d64545;--warn:#e08a1e;--ink:#1d2b2f;--sub:#6a7d82;--line:#dbe6e9;--gold:#b8860b}
/* 背题题目导航 */
.navgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:10px 0 4px}
.ncell{aspect-ratio:1;border-radius:9px;border:1.5px solid var(--line);background:#fff;color:var(--ink);
 font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;padding:0}
.ncell.done{background:#e4f6ee;border-color:var(--ok);color:var(--ok)}
.ncell.review{background:#fdeaea;border-color:var(--bad);color:var(--bad)}
.ncell.cur{outline:3px solid rgba(31,111,139,.35);border-color:var(--blue)}
.ncell:disabled{opacity:.55}
.navlegend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--sub);margin:4px 0 2px}
.navlegend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.navlegend .ld{background:#e4f6ee;border:1px solid var(--ok)}
.navlegend .lr{background:#fdeaea;border:1px solid var(--bad)}
.navlegend .ln{background:#fff;border:1px solid var(--line)}
.casejump{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.casejump button{font-size:13px;padding:7px 11px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--blue);font-weight:600}
.jumplink{width:100%;margin-top:10px;background:var(--bg);border:1px dashed var(--blue2);color:var(--blue);
 border-radius:10px;padding:9px;font-size:14px;font-weight:700}
.prevbtn{background:#fff;color:var(--blue);border:1.5px solid var(--blue2);margin-bottom:9px}
/* 背题题目地图 */
.mapcase{font-size:13px;font-weight:700;color:var(--blue);margin:14px 2px 7px;display:flex;gap:7px;align-items:baseline}
.mapcase .mc-diag{color:var(--ink);font-weight:600;font-size:13.5px}
.mapitem{display:flex;align-items:flex-start;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:11px;
 padding:11px 12px;margin-bottom:8px;width:100%;text-align:left;cursor:pointer}
.mapitem:active{background:#f3f8fa}
.mapdot{flex:0 0 24px;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);color:var(--sub);
 font-size:12.5px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px}
.mapitem.done .mapdot{background:#e4f6ee;border-color:var(--ok);color:var(--ok)}
.mapitem.review .mapdot{background:#fdeaea;border-color:var(--bad);color:var(--bad)}
.mapbody{flex:1;min-width:0}
.maptag{font-size:11.5px;color:var(--sub);display:block;margin-bottom:2px}
.mapstem{font-size:14.5px;line-height:1.4;color:var(--ink);
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mapgo{flex:0 0 auto;color:var(--blue2);font-size:18px;align-self:center}
/* 科目菜单 */
.subjcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);
 border-radius:13px;padding:13px 14px;margin-bottom:10px;cursor:pointer}
.subjcard:active{background:#f3f8fa}
.sj-ico{font-size:24px;flex:0 0 auto}
.sj-body{flex:1;min-width:0;display:flex;flex-direction:column}
.sj-body b{font-size:16px;color:var(--ink)}
.sj-meta{font-size:12.5px;color:var(--sub);margin-top:2px}
/* 地图筛选 */
.filterbar{display:flex;gap:7px;flex-wrap:wrap}
.filterchip{border:1.5px solid var(--line);background:#fff;color:var(--sub);border-radius:20px;
 padding:7px 14px;font-size:13.5px;font-weight:700}
.filterchip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.qnavrow{display:flex;gap:8px;margin-top:9px}
.qnavrow>button{flex:1;background:#fff;color:var(--blue);border:1.5px solid var(--blue2);border-radius:10px;padding:10px 4px;font-size:13.5px;font-weight:700}
.qnavrow .mapbtn{background:var(--blue);color:#fff;border-color:var(--blue)}
.qnavrow>span{flex:1}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:680px;margin:0 auto;padding:14px 14px 90px}
.hd{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;margin:-14px -14px 12px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
.hd .back{background:rgba(255,255,255,.18);border:none;color:#fff;width:34px;height:34px;border-radius:10px;font-size:18px;flex:0 0 auto}
.hd .tt{font-weight:700;font-size:17px;flex:1;line-height:1.25}
.hd .timer{font-variant-numeric:tabular-nums;background:rgba(0,0,0,.25);padding:5px 10px;border-radius:9px;font-weight:700}
.hdnav{background:rgba(255,255,255,.18);border:none;color:#fff;padding:6px 12px;border-radius:9px;font-size:13.5px;font-weight:700;flex:0 0 auto}
.card{background:var(--card);border-radius:14px;padding:14px 15px;margin-bottom:12px;box-shadow:0 1px 3px rgba(20,60,70,.06)}
.home-title{text-align:center;margin:8px 0 4px;font-size:22px;font-weight:800;color:var(--blue)}
.home-sub{text-align:center;color:var(--sub);font-size:13px;margin-bottom:16px}
.bigbtn{display:block;width:100%;border:none;border-radius:14px;padding:16px;font-size:17px;font-weight:700;color:#fff;margin-bottom:12px;box-shadow:0 3px 10px rgba(31,111,139,.18)}
.bigbtn .d{display:block;font-weight:400;font-size:12.5px;opacity:.9;margin-top:3px}
.b1{background:linear-gradient(135deg,#1f6f8b,#2b8da8)}
.b2{background:linear-gradient(135deg,#1a9d6b,#27b783)}
.b3{background:linear-gradient(135deg,#e08a1e,#f0a638)}
.b4{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.sets{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:6px 0 4px}
.setchip{border:1.5px solid var(--line);background:#fff;border-radius:11px;padding:12px 0;text-align:center;font-weight:700;color:var(--blue);font-size:15px}
.setchip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.muted{color:var(--sub);font-size:12.5px}
.case{border-left:4px solid var(--blue2);background:#f4f9fb;border-radius:0 10px 10px 0;padding:9px 12px;margin-bottom:10px}
.case .ct{font-weight:700;color:var(--blue);font-size:14px;margin-bottom:4px}
.case .row{font-size:14px;margin:2px 0}.case .row b{color:#33545c}
details.case summary{font-weight:700;color:var(--blue);font-size:14px;outline:none}
.qtag{display:inline-block;font-size:11.5px;font-weight:700;color:var(--blue);background:#e3f0f5;border-radius:6px;padding:2px 8px;margin-bottom:6px}
.qstem{font-weight:700;font-size:15.5px;margin:0 0 10px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:9px;background:#fff;cursor:pointer}
.opt .L{flex:0 0 24px;height:24px;border-radius:50%;border:1.6px solid #9bb6bd;color:#5a7278;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:14px}
.opt .X{flex:1;font-size:15px}
.opt.sel{border-color:var(--blue);background:#eef7fb}
.opt.sel .L{background:var(--blue);color:#fff;border-color:var(--blue)}
.opt.correct{border-color:var(--ok);background:#e9f8f2}
.opt.correct .L{background:var(--ok);color:#fff;border-color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:#fdecec}
.opt.wrong .L{background:var(--bad);color:#fff;border-color:var(--bad)}
.opt.dim{opacity:.55}
.verdict{border-radius:11px;padding:10px 12px;margin:10px 0 6px;font-weight:700;font-size:14.5px}
.v-ok{background:#e9f8f2;color:#0f7d53;border:1px solid #b6e5d2}
.v-part{background:#fdf3e3;color:#b06a10;border:1px solid #f3d9ad}
.v-bad{background:#fdecec;color:#b32f2f;border:1px solid #f2c4c4}
.exp{background:#f6f8f9;border-radius:10px;padding:10px 12px;font-size:13.5px;color:#3c4f54;margin-top:6px}
.exp b{color:var(--bad)}
.btn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:16px;font-weight:700;color:#fff}
.btn-pri{background:var(--blue)}
.btn-ok{background:var(--ok)}
.btn-ghost{background:#fff;color:var(--blue);border:1.5px solid var(--blue)}
.btn[disabled]{opacity:.45}
.footspace{height:14px}
.scorehero{text-align:center;padding:18px 10px 8px}
.scorehero .num{font-size:52px;font-weight:800;color:var(--blue);line-height:1}
.scorehero .lb{color:var(--sub);margin-top:6px;font-size:14px}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.stat{background:#f4f9fb;border-radius:10px;padding:10px;text-align:center}
.stat .n{font-size:20px;font-weight:800;color:var(--blue)}
.stat .t{font-size:12px;color:var(--sub)}
.qblock{border-top:1px dashed var(--line);padding-top:12px;margin-top:12px}
.review-head{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.pill{font-size:11.5px;font-weight:700;border-radius:6px;padding:2px 8px}
.pill.cat{background:#e3f0f5;color:var(--blue)}
.pill.right{background:#e9f8f2;color:var(--ok)}
.pill.miss{background:#fdf3e3;color:var(--warn)}
.bar{height:8px;background:#e4edf0;border-radius:5px;overflow:hidden;margin:4px 0 2px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--blue2))}
.note{font-size:12px;color:var(--sub);background:#fff;border:1px dashed var(--line);border-radius:10px;padding:9px 11px;margin-bottom:12px}
.wrongitem{border-left:4px solid var(--bad)}
.empty{text-align:center;color:var(--sub);padding:40px 10px;font-size:14px}
a{color:var(--blue)}
</style>
<style>
/* ===== 评分细则/人文 覆盖层（作用域#fg，不影响刷题） ===== */
#fg{position:fixed;inset:0;z-index:9999;display:none;background:#0f1420;color:#e8edf6;
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
 line-height:1.55;font-size:16px;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:46px}
#fg.on{display:block}
#fg *{box-sizing:border-box}
#fg .fhd{position:sticky;top:0;z-index:5;background:rgba(15,20,32,.94);backdrop-filter:blur(12px);
 padding:calc(10px + env(safe-area-inset-top)) 14px 0;border-bottom:1px solid #2c3852}
#fg .fback{position:absolute;left:10px;top:calc(12px + env(safe-area-inset-top));width:34px;height:34px;
 border-radius:50%;background:#1a2233;color:#e8edf6;border:1px solid #2c3852;font-size:22px;line-height:30px}
#fg .ftt{text-align:center;font-weight:700;font-size:17px;padding:6px 40px}
#fg .ftabs{display:flex;gap:6px;padding:10px 0;overflow-x:auto;-webkit-overflow-scrolling:touch}
#fg .ftabs::-webkit-scrollbar{display:none}
#fg .ftab{flex:0 0 auto;text-align:center;padding:9px 12px;border-radius:10px;background:#1a2233;color:#9fb0c8;
 font-size:13px;font-weight:600;border:1px solid #2c3852;white-space:nowrap}
#fg .ftab.on{background:#4f9cff;color:#fff;border-color:#4f9cff}
#fg .fbody{padding:14px}
#fg .fpg{display:none}#fg .fpg.on{display:block}
#fg .bar{display:flex;gap:8px;margin-bottom:14px}
#fg .sb{flex:1;border-radius:12px;padding:10px 4px;text-align:center;background:#1a2233;border:1px solid #2c3852}
#fg .sb b{display:block;font-size:22px;line-height:1.1}#fg .sb span{font-size:11px;color:#9fb0c8}
#fg .sb.dv b{color:#f5b942}#fg .sb.pp b{color:#4f9cff}#fg .sb.rr b{color:#37d39b}
#fg .sec{background:#1a2233;border:1px solid #2c3852;border-radius:14px;padding:14px;margin-bottom:12px}
#fg .sec h3{margin:0 0 10px;font-size:16px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#fg .tg{font-size:11px;font-weight:700;padding:2px 8px;border-radius:20px}
#fg .tg.p{background:rgba(79,156,255,.18);color:#4f9cff}
#fg .tg.r{background:rgba(55,211,155,.16);color:#37d39b}
#fg .tg.d{background:rgba(245,185,66,.16);color:#f5b942}
#fg table{width:100%;border-collapse:collapse;font-size:14px}
#fg th,#fg td{text-align:left;padding:8px 6px;border-bottom:1px solid #2c3852;vertical-align:top}
#fg th{color:#9fb0c8;font-weight:600;font-size:12px}
#fg td.pts{text-align:center;white-space:nowrap;color:#f5b942;font-weight:700;width:42px}
#fg tr.gp td{background:#202a3f;font-weight:700;color:#b48cff;font-size:13px}
#fg tr.gp .pts{color:#b48cff}
#fg .num{color:#f5b942;font-weight:700}
#fg .bad{color:#ff6b6b;font-weight:700}
#fg .ok{color:#37d39b;font-weight:700}
#fg .flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0 2px}
#fg .step{background:#202a3f;border:1px solid #2c3852;border-radius:8px;padding:5px 10px;font-size:13px;font-weight:600}
#fg .arr{color:#9fb0c8;font-size:12px}
#fg .note{background:rgba(79,156,255,.08);border-left:3px solid #4f9cff;border-radius:0 10px 10px 0;
 padding:10px 12px;font-size:13.5px;margin-top:10px;color:#cfe0ff}
#fg .note.gold{background:rgba(245,185,66,.08);border-color:#f5b942;color:#ffe6b8}
#fg .seg{display:flex;gap:8px;margin:2px 0 12px}
#fg .seg button{flex:1;padding:9px;border-radius:10px;border:1px solid #2c3852;background:#1a2233;
 color:#9fb0c8;font-size:14px;font-weight:700}
#fg .seg button.on{background:#b48cff;color:#fff;border-color:#b48cff}
#fg .cr{display:none}#fg .cr.on{display:block}
#fg .dg{display:grid;grid-template-columns:60px 1fr;border:1px solid #2c3852;border-radius:10px;overflow:hidden;font-size:14px}
#fg .dg>div{padding:8px 10px;border-bottom:1px solid #2c3852}
#fg .dg .face{background:#202a3f;font-weight:700;color:#4f9cff}
#fg .dg>div:nth-last-child(-n+2){border-bottom:none}
#fg ul.tight{margin:6px 0;padding-left:20px;font-size:14px}#fg ul.tight li{margin-bottom:6px}
#fg .burrow{display:flex;gap:12px;align-items:center;padding:10px 2px;border-bottom:1px solid #2c3852}
#fg .burrow:last-child{border-bottom:none}
#fg .burrow svg{flex:0 0 34px;width:34px;height:78px;filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#fg .burimg{flex:0 0 30px;width:30px;height:96px;min-height:88px;object-fit:contain;background:#fff;border-radius:6px;padding:3px 2px;box-shadow:0 1px 3px rgba(0,0,0,.3)}
#fg .binfo{flex:1;min-width:0}
#fg .bmodel{font-size:16px;font-weight:700;color:#f5b942;margin-bottom:2px}
#fg .bdesc{font-size:13px;color:#c6d2e4;line-height:1.45}
#fg .bgrit{font-size:11px;font-weight:700;color:#fff;background:#e05252;border-radius:6px;padding:1px 6px;margin-left:5px;vertical-align:1px}
#fg .burrow.fine .bmodel{color:#ff9a9a}
#fg .sub{font-size:13.5px;font-weight:700;color:#9fb0c8;margin:12px 0 6px}
#fg .hblk{background:#1a2233;border:1px solid #2c3852;border-radius:14px;padding:0;margin-bottom:12px;overflow:hidden}
#fg .hblk summary{padding:13px 14px;font-weight:700;font-size:15px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
#fg .hblk summary::-webkit-details-marker{display:none}
#fg .hblk summary::after{content:"›";color:#9fb0c8;font-size:20px;transition:transform .2s}
#fg .hblk[open] summary::after{transform:rotate(90deg)}
#fg .hblk .hin{padding:0 14px 14px;font-size:14px}
#fg .hblk .hin p{margin:6px 0}
#fg .memcard{background:#1a2233;border:1px solid #2c3852;border-radius:14px;margin-bottom:12px;overflow:hidden}
#fg .memcard>summary{padding:13px 14px;font-weight:700;font-size:15px;color:#f5b942;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
#fg .memcard>summary::-webkit-details-marker{display:none}
#fg .memcard>summary::after{content:"›";color:#9fb0c8;font-size:20px;transition:transform .2s}
#fg .memcard[open]>summary::after{transform:rotate(90deg)}
#fg .memcard .min{padding:0 14px 14px;font-size:14px;color:#d7e0ee}
#fg .memcard .mblk{margin-top:10px;border-left:3px solid #4f9cff;padding-left:10px}
#fg .memcard .mblk h4{margin:0 0 6px;font-size:13.5px;color:#7fd0ff}
#fg .memcard p{margin:6px 0;line-height:1.65}
#fg .memcard table{width:100%;border-collapse:collapse;font-size:12.5px;margin:6px 0}
#fg .memcard th,#fg .memcard td{border:1px solid #2c3852;padding:6px;text-align:left;vertical-align:top}
#fg .memcard th{background:#202a3f;color:#bcd}
#fg .memcard ul,#fg .memcard ol{margin:6px 0;padding-left:20px}#fg .memcard li{margin:4px 0;line-height:1.6}
#fg .memcard .memquote{background:rgba(245,185,66,.1);border-left:3px solid #f5b942;border-radius:0 8px 8px 0;padding:7px 10px;font-size:13px;color:#ffe6b8;margin:6px 0}
#fg .memsub{font-size:13px;color:#9fb0c8;margin:0 0 12px}
</style>
</head>

<script>
const DATA=[{"name": "第1套", "cases": [{"no": "病例一", "subj": "牙体牙髓病学", "cat": "牙体牙髓", "diag": "26 急性牙髓炎（化脓期）", "level": "中", "time": "6分钟", "stem": [{"k": "患者", "v": "男，32岁，职员。"}, {"k": "主诉", "v": "左上后牙自发性疼痛3天，加重伴夜间痛1天。"}, {"k": "现病史", "v": "3天前左上后牙无明显诱因出现自发性、阵发性疼痛，遇冷热刺激疼痛明显加重，疼痛放射至同侧颞部、耳部，不能明确指出具体患牙。1天来发作频繁、持续时间延长，夜间痛明显、平卧时加重，自服止痛药效果不佳；就诊前疼痛剧烈，口含冷水可暂时缓解。无面部肿胀、发热及张口受限，否认咬合痛明显加重。26数月前外院充填，术后偶有冷热敏感，未行根管治疗。"}, {"k": "既往史", "v": "体健，否认系统病史及药物过敏史。"}, {"k": "口腔检查", "v": "26远中邻合面旧充填体，边缘见继发龋，探及软化牙本质并达髓腔，探痛（++）。26叩诊（±），不松动，颊侧牙龈无红肿窦道、未及波动感，咬诊无特异痛。冷热测：冷测反应剧烈、热测引发剧痛，刺激去除后疼痛持续数十秒；热测剧痛、冷水含漱可缓解。电活力测验26有反应、较对照牙敏感。25、27牙体及活力未见异常，龈乳头形态基本正常。"}, {"k": "X线", "v": "26远中邻面低密度影近髓/及髓；根尖周膜腔基本正常，根尖区未见骨质破坏暗影，牙槽骨无明显吸收。"}], "qs": [{"tag": "病史采集·多选", "stem": "为明确诊断，接诊时采集疼痛病史应重点询问哪些特征？", "opts": ["疼痛的发作方式（自发性/激发性、阵发性/持续性）", "疼痛能否自行定位、有无放散及放散范围", "疼痛与冷热刺激的关系，及刺激去除后是否持续", "有无夜间痛、平卧时加重", "咬紧牙后疼痛是否反而缓解", "患者的职业与经济收入"], "ans": "ABCD", "exp": "ABCD为急性牙髓炎“疼痛四性+夜间痛+不能定位”核心病史；E“咬紧缓解”是急性根尖周炎浆液期特征（鉴别干扰）；F与诊断无关。"}, {"tag": "牙髓检查·多选", "stem": "关于本例温度测验与电活力测验的判读，正确的是：", "opts": ["急性牙髓炎热测可引发剧痛，刺激去除后疼痛仍持续", "电活力测验只记录“有反应/无反应”，不解读具体阈值数字", "牙髓化脓时可出现热测剧痛、冷测缓解（热痛冷缓解）", "温度测验应先测对照牙，再测可疑牙", "冷热测无反应即可单独诊断急性牙髓炎", "急性牙髓炎患牙电活力测验一定无反应"], "ans": "ABCD", "exp": "E无反应提示牙髓坏死/根尖周炎，不支持急性牙髓炎；F急性牙髓炎牙髓仍有活力，电活力多为有反应、敏感（阈值降低）。"}, {"tag": "诊断·单选", "stem": "综合病史与检查，最可能的诊断是：", "opts": ["26急性根尖周炎", "26急性牙髓炎（化脓期）", "26慢性牙髓炎", "急性上颌窦炎", "三叉神经痛", "26牙本质过敏症"], "ans": "B", "exp": "自发阵发+夜间痛+不能定位+温度持续痛+热痛冷缓解+活力敏感、根尖无暗影，符合急性牙髓炎化脓期。根尖周炎应能定位、叩痛、活力多丧失；上颌窦炎多牙+鼻塞+弯腰加重；三叉神经痛有扳机点秒痛；牙本质过敏无自发夜间痛。"}, {"tag": "鉴别诊断·多选", "stem": "本例（考试轨）需要与下列哪些疾病鉴别？", "opts": ["三叉神经痛", "急性上颌窦炎", "急性龈乳头炎", "急性根尖周炎", "复发性阿弗他溃疡", "慢性牙周炎"], "ans": "ABC", "exp": "执业医师技能考试“急性牙髓炎三鉴别”=龈乳头炎+三叉神经痛+急性上颌窦炎（26为上颌后牙，上颌窦炎必须鉴别）。急性根尖周炎临床需鉴别，但教科书多视为同一疾病进程，机考按考试三鉴别；阿弗他溃疡、牙周炎与本急症无关。"}, {"tag": "鉴别依据·多选", "stem": "下列关于三叉神经痛的描述，可用于与本例鉴别的是：", "opts": ["存在扳机点，轻触特定部位即诱发", "疼痛为电击样、刀割样，历时短暂（数秒）", "发作与冷热刺激无关，夜间多不发作", "患牙牙体及活力多正常，误拔牙后疼痛仍不消失", "治疗首选对患牙行根管治疗", "一次发作常持续数小时不缓解"], "ans": "ABCD", "exp": "E错：三叉 则上健康（必要时经完善根管治疗后评估）", "基牙数目与牙周潜力足以承担桥体合力", "任何松动牙都无需评估即可作基牙", "基牙越弱越好、便于磨除"], "ans": "ABCD", "exp": "基牙需牙体、牙根、牙周、牙髓及负荷能力合格；松动/支持不足者不宜直接作桥基。"}, {"tag": "固定桥设计·多选", "stem": "固定桥正确的设计原则有：", "opts": ["恢复缺牙功能与外形，合力不超过基牙牙周潜力", "正确恢复邻接与外展隙、便于自洁", "共同就位道、边缘密合", "合理减小桥体颊舌径以减力", "桥体与牙槽嵴接触越紧越好、不必清洁", "可任意延长桥的长度"], "ans": "ABCD", "exp": "保护基牙、共同就位道、密合与自洁、必要时减径是原则；压迫黏膜不清洁、任意延长均错误。"}, {"tag": "方案权衡·多选", "stem": "向患者说明不同方案时正确的是：", "opts": ["固定桥舒适高效但需磨除邻牙牙体", "种植不磨邻牙但需外科手术、费用与周期较高且受骨条件限制", "可摘义齿磨除牙体少、适应范围广但有异物感、恢复效率相对低", "应结合口腔条件、全身状况与意愿共同决策", "只推荐最贵方案、不评估条件", "三种方式效果与代价完全相同无需说明"], "ans": "ABCD", "exp": "据适应证、费用、创伤与患者意愿做知情选择；不能只推贵价或认为各方案等价。"}]}]}];

const MEM=[{"subject": "口腔修复学", "cards": [{"title": "1. Kennedy（肯尼迪）牙列缺损分类及亚类 ⭐", "blocks": [{"h": "【核心】四大主类", "html": "<table><thead><tr><th>类别</th><th>别名</th><th>定义</th><th>支持方式</th></tr></thead><tbody><tr><td><b>第一类</b></td><td>双侧游离缺失</td><td>牙弓<b>两侧后部</b>牙缺失，远中为游离端、无天然牙</td><td>黏膜支持 / 混合支持</td></tr><tr><td><b>第二类</b></td><td>单侧游离缺失</td><td>牙弓<b>一侧后部</b>牙缺失，远中游离，余留天然牙在缺隙近中</td><td>黏膜支持 / 混合支持</td></tr><tr><td><b>第三类</b></td><td>单侧非游离缺失（间隙缺隙）</td><td>缺隙在牙弓一侧，<b>缺隙近、远中都有天然牙</b></td><td><b>牙支持式</b>（最稳）</td></tr><tr><td><b>第四类</b></td><td>前部跨中线缺失</td><td>牙弓<b>前部</b>牙缺失并<b>跨过中线</b>，天然牙只在缺隙远中；<b>只有单个缺隙</b></td><td>混合支持</td></tr></tbody></table>"}, {"h": "【核心】亚类（Modification）", "html": "<ul class='tight'><li>除决定主分类的缺隙外，<b>附加缺隙（缝）的数量</b> = 亚类数。</li><li>例：双侧游离缺牙 + 另有 1 个缺隙 → <b>Kennedy 第一类一亚类</b>；另有 2 个 → 第一类二亚类。</li><li>亚类<b>只用于第一、二、三类</b>；<b>第四类没有亚类</b>。</li><li>数的是「<b>缺隙数</b>」，不是「缺牙数」——一个缝里连缺 3 颗牙也只算 1 个亚类。</li></ul>"}, {"h": "【核心】Applegate 八条法则（分类补充规则，大题/判断题高频）", "html": "<ol><li>分类应在可能改变分类的<b>拔牙、牙体治疗之后</b>再定。</li><li><b>第二磨牙缺失且不修复</b> → 不影响分类。</li><li><b>第三磨牙（智齿）缺失且不修复</b> → 不影响分类。</li><li>第三磨牙存在且<b>要用作基牙</b> → 必须计入分类。</li><li>第二磨牙若以第一、三磨牙为基牙做<b>固定桥修复</b> → 按<b>第三类</b>论。</li><li>以<b>最靠后的缺隙</b>决定主分类。</li><li>主缺隙以外的其余缺隙数目决定亚类。</li><li><b>第四类无亚类</b>：前部跨中线缺隙之外若还有后部缺隙，则改按后部缺隙定主类。</li></ol>"}, {"h": "【速记口诀】", "html": "<ul class='tight'><li>主类一句：<b>「一双、二单、三间、四前跨中」</b></li><li>一＝双侧游离；二＝单侧游离；三＝前后有牙的间隙；四＝前部跨中线单个缺隙</li><li>亚类一句：<b>「数缝不数牙，四类没有亚」</b></li><li>归类一句：<b>「最后缺隙定主类」</b></li></ul>"}, {"h": "【易错点 / 题眼】", "html": "<ol><li>第四类必须是<b>单个缺隙且跨过中线</b>；只要还存在其他缺隙，就不能判第四类（按最后部缺隙归类）。</li><li>亚类数的是<b>缺隙（缝）数</b>，不是缺牙颗数。</li><li>智齿缺失不修复→<b>忽略不计</b>；但当基牙用→<b>计入分类</b>。</li><li>勿与 <b>Cummer 分类</b>混淆：Cummer 是按<b>支点线（直接固位体连线）与牙弓的关系</b>，分斜线式、纵线式、横线式、平面式四型。</li><li>第一、二类＝游离端义齿，考点在 RPI 卡环组、回力卡环、应力中断、功能性印模；第三类＝牙支持式，固位稳定最好。</li></ol><p>---</p>"}]}]}, {"subject": "院感·预防·临床用药", "cards": [{"title": "1. 消毒防腐药与常用药物浓度剂量 ⭐【盲区·浓度专题】", "blocks": [{"h": "【核心】含漱液与腔道冲洗", "html": "<table><thead><tr><th>药物</th><th>浓度</th><th>用途/要点</th></tr></thead><tbody><tr><td><b>葡萄糖酸氯己定（洗必泰）</b></td><td><b>0.12%</b>（0.12%～0.2%）</td><td>术前含漱15mL×1min、牙周/术后含漱；不被黏膜吸收</td></tr><tr><td><b>醋酸氯己定</b></td><td><b>0.02%</b></td><td>与上题同效，浓度不同——<b>盐不同、浓度不同</b></td></tr><tr><td>过氧化氢（双氧水）</td><td><b>1%～3%</b></td><td>NUG冠周炎冲洗、含漱、根管冲洗；<b>30%为强腐蚀漂白剂，禁含漱</b></td></tr><tr><td>次氯酸钠</td><td><b>0.5%～5.25%</b>（常用1%～2.5%）</td><td><b>只冲根管</b>，溶解有机残渣、杀菌，不作含漱（刺激黏膜）</td></tr><tr><td>碳酸氢钠</td><td><b>2%～4%</b></td><td>含漱，抗酸、抑制念珠菌（雪口）</td></tr><tr><td>高锰酸钾</td><td><b>1:5000（约0.02%）</b></td><td>淡粉红色即可，浓了灼伤黏膜</td></tr></tbody></table>"}, {"h": "【核心】皮肤与口腔黏膜消毒", "html": "<table><thead><tr><th>药物</th><th>皮肤</th><th>黏膜/创面</th><th>要点</th></tr></thead><tbody><tr><td>碘伏（有效碘）</td><td><b>0.5%～1%</b></td><td><b>0.1%（0.1%～0.5%稀释）</b></td><td><b>不需脱碘</b>、刺激小，口腔最常用</td></tr><tr><td>碘酊</td><td><b>2%</b>（一般2%、3%）</td><td>口腔内少用</td><td>用后<b>必须75%酒精脱碘</b>；碘过敏禁用</td></tr><tr><td>乙醇（酒精）</td><td><b>75%（70%～75%）</b></td><td>不用</td><td><b>75%杀菌力最强</b>，95%使表面蛋白凝固反杀不透</td></tr><tr><td>过氧化氢</td><td>—</td><td>3%</td><td>污染、厌氧菌伤口冲洗</td></tr></tbody></table>"}, {"h": "【核心】环境物表·器械消毒（有效氯 mg/L）", "html": "<table><thead><tr><th>对象</th><th>有效氯浓度</th><th>备注</th></tr></thead><tbody><tr><td>一般物表、地面（一客一消毒）</td><td><b>500 mg/L</b>，作用≥30min</td><td>先清洁后消毒</td></tr><tr><td>被血液/体液明显污染</td><td><b>1000～2000 mg/L</b></td><td>先吸附清除污物再消毒</td></tr><tr><td>疫源地/明显污染环境</td><td>2000～5000 mg/L</td><td>—</td></tr><tr><td>戊二醛</td><td><b>2%</b></td><td>浸泡高水平消毒/灭菌，有毒须通风，不用于皮肤黏膜</td></tr><tr><td>过氧乙酸</td><td>0.2%～0.5%</td><td>物表浸泡/喷雾，现配</td></tr></tbody></table><div class=\"memquote\">含氯消毒剂：<b>现配现用、避光、每日更换</b>，对金属有腐蚀性。</div>"}, {"h": "【核心】局麻药极量与肾上腺素（mg/kg）", "html": "<table><thead><tr><th>药</th><th>一次极量</th><th>说明</th></tr></thead><tbody><tr><td>利多卡因（不加肾上腺素）</td><td><b>4.4 mg/kg，成人≤400mg</b></td><td>2%制剂20mg/mL，5mL/支=100mg</td></tr><tr><td>利多卡因（加肾上腺素）</td><td><b>7 mg/kg</b></td><td>加血管收缩剂后限量提高</td></tr><tr><td>阿替卡因（4%含1:100000肾）</td><td><b>7 mg/kg</b></td><td>4%=40mg/mL，1.7mL/支≈68mg</td></tr><tr><td>普鲁卡因</td><td>≤1000mg</td><td>酯类，需皮试（已少用）</td></tr><tr><td>肾上腺素（局麻液中）</td><td><b>1:100000</b></td><td>高血压/甲亢/近期心梗等慎用或不用</td></tr><tr><td>肾上腺素（过敏性休克抢救）</td><td><b>0.1%（1mg/mL）肌注0.3～0.5mg</b></td><td>大腿前外侧，5～15min可重复</td></tr></tbody></table>"}, {"h": "【核心】牙体·修复·预防常用浓度", "html": "<table><thead><tr><th>项目</th><th>浓度</th><th>要点</th></tr></thead><tbody><tr><td>磷酸酸蚀釉质</td><td><b>30%～50%（常用37%）</b></td><td>恒牙30s；乳牙、氟斑牙60s</td></tr><tr><td>氢氟酸酸蚀瓷</td><td><b>5%～10%</b></td><td>只处理瓷修复体，<b>禁用于口内组织</b></td></tr><tr><td>诊室牙漂白 过氧化氢</td><td><b>30%～35%</b></td><td>椅旁、护龈</td></tr><tr><td>家庭牙漂白 过氧化脲</td><td><b>10%</b>（约释3.6%过氧化氢）</td><td>夜间托盘</td></tr><tr><td>APF含氟凝胶/泡沫</td><td><b>1.23%（12300ppm）</b></td><td>专业涂用4分钟</td></tr><tr><td>含氟涂料</td><td><b>5%氟化钠（NaF）</b></td><td>每3～6月一次</td></tr><tr><td>含氟漱口液 0.2% NaF</td><td>0.2%（≈900ppm）</td><td><b>每周1次</b></td></tr><tr><td>含氟漱口液 0.05% NaF</td><td>0.05%（≈225ppm）</td><td><b>每日1次</b></td></tr><tr><td>氟化氨银 SDF</td><td>38%</td><td>防龋/停止龋进展，染黑</td></tr><tr><td>含氟牙膏</td><td>1000～1500ppm</td><td>&lt;3岁米粒、3～6岁豌豆量</td></tr></tbody></table>"}, {"h": "【速记口诀】", "html": "<ul class='tight'><li>氯己定：<b>「葡萄糖点一二，醋酸点零二」</b>（配对别交叉）。</li><li>消毒：<b>「酒精七十五，碘伏皮肤点五、黏膜点一；碘伏不脱碘，碘酊要脱碘」</b>。</li><li>含氯：<b>「平时五百，见血一到两千」</b>（mg/L）。</li><li>局麻：<b>「利多四百、加肾七百（mg/kg）」</b>。</li><li>用氟：<b>「凝胶一点二三，漱氟周二点二、日点零五」</b>。</li><li>酸蚀：<b>「釉质三十七，氢氟酸只啃瓷」</b>。</li></ul>"}, {"h": "【易错点 / 题眼】", "html": "<ol><li><b>盐与浓度必须配对</b>：0.12%=葡萄糖酸氯己定，0.02%=醋酸氯己定；0.12%醋酸、0.02%葡萄糖都是错项。</li><li>酒精不是越浓越好：<b>75%最强</b>，95%反而凝固表层蛋白、杀不透。</li><li>单位别混：含氯/氟多为 <b>mg/L（ppm）</b>，局麻药是 <b>mg/kg</b>，含漱酸蚀是 <b>%</b>。</li><li><b>过氧化氢3%可冲可含漱，30%只能漂白</b>；次氯酸钠<b>只冲根管不入口</b>。</li><li>碘伏<b>不脱碘</b>、碘酊<b>必脱碘</b>——高频判断题。</li><li>戊二醛2%用于器械，<b>不能擦皮肤黏膜</b>；含氯现配现用、腐蚀金属。</li><li>肾上腺素两个浓度别混：局麻药里<b>1:100000</b>，抢救休克是<b>0.1%肌注</b>。</li></ol><p>---</p>"}]}]}];

，看完一位患者直接接着看下一位"], "ans": "ABCE", "exp": "脱手套后必须手卫生，手套不能视为绝对屏障；每患者间手卫生+更换手套，D、F错。外科手消毒要求更高（≤5CFU/cm²）。"}, {"tag": "手机处理·多选", "stem": "高速、低速牙科手机的消毒灭菌，正确的是：", "opts": ["一人一用一灭菌", "使用后先去表面污染，再机械热力清洗（手机清洗注油机）内腔", "清洗干燥后注油保养、独立包装", "首选压力蒸汽灭菌，灭菌后干燥密闭存放并在有效期内使用", "诊间用75%酒精棉球擦拭手机外部即可继续给下一位患者使用", "空心器械内腔不需处理，只擦表面即可"], "ans": "ABCD", "exp": "手机属进入患者口腔、可被血液回吸污染的高度危险性中空器械，必须全程灭菌并处理内腔；仅表面擦拭不能消除回吸入内腔的病原，E、F错。"}, {"tag": "Spaulding分类·多选", "stem": "按器械危险程度选择处理方式，正确的是：", "opts": ["穿破黏膜/进入无菌组织、骨、根管的高危器械（拔牙钳、车针、根管锉、牙周探针穿破组织者）必须灭菌", "接触完整黏膜不穿破组织的中危器械（口镜、镊子、充填器）应高水平消毒或灭菌", "只接触完整皮肤的低危物品（血压计袖带等）清洁后低水平消毒即可", "灭菌首选可靠的压力蒸汽灭菌", "化学消毒液浸泡可作为车针、根管器械的常规首选灭菌方式", "一次性医疗器械用后按医疗废物处理，不得重复使用"], "ans": "ABCDF", "exp": "化学浸泡受浓度、时间、有机物影响大、无法用包内化学/生物监测验证，不能作为高危器械常规首选灭菌方式，E错。"}, {"tag": "灭菌监测·多选", "stem": "压力蒸汽灭菌的质量监测，正确的是：", "opts": ["包括工艺（物理）监测、化学监测和生物监测", "每包应使用包外化学指示物，高危/手术包内还应放置包内化学指示物", "生物监测以嗜热脂肪地芽孢杆菌（枯草杆菌芽孢用于干热/环氧乙烷）芽孢为指示菌", "生物监测至少每周进行一次，植入物相关灭菌应每批次监测", "化学指示胶带变色即等同灭菌完全合格，无需生物监测", "灭菌温度、压力、时间等工艺参数每锅记录"], "ans": "ABCDF", "exp": "化学指示物只提示是否经过灭菌过程及关键参数是否大致达到，不能替代生物监测；生物监测是判断灭菌效果最可靠的方法，E错。"}, {"tag": "B-D试验·多选", "stem": "预真空（脉动真空）压力蒸汽灭菌器的Bowie-Dick（B-D）试验，正确的是：", "opts": ["用于检测灭菌器冷空气排除和蒸汽穿透效果", "应在每日开始灭菌运行前空载进行", "其本质是一次生物监测", "只在新装机器时做一次即可", "用于监测灭菌物品的无菌有效期", "B-D试验不合格不影响当天正常使用"], "ans": "AB", "exp": "B-D试验是专门检测预真空灭菌器空气排除效果/有无漏气的化学试验，每日首锅空载进行，不合格须查明原因、排除故障后方可使用；它不是生物监测（C错），也不能只做一次（D错）。"}, {"tag": "治疗台水路·多选", "stem": "关于牙科综合治疗台水路（DUWL）污染控制，正确的是：", "opts": ["手机、三用枪停止使用瞬间可产生回吸，应选用带防回吸装置的手机和综合治疗台", "每日开诊前冲洗手机及三用枪管路至少2–3分钟", "每位患者治疗后再冲洗管路20–30秒", "可使用独立供水系统（纯净水/无菌水）并定期消毒水路、水瓶", "出水水质应符合生活饮用水卫生要求，定期送检监测", "水路从不清洗也不会形成生物膜，不影响患者"], "ans": "ABCDE", "exp": "DUWL细长管路极易形成生物膜、回吸可致患者间交叉污染，须防回吸+定时冲洗+水质监测，F错。"}, {"tag": "环境物表消毒·多选", "stem": "诊疗环境物表清洁消毒，正确的是：", "opts": ["遵循'先清洁、后消毒'，一客一用一消毒高频接触面（灯柄、扶手、按键、头靠等）", "可使用合格消毒湿巾或含氯消毒剂擦拭，作用足够时间", "一般物表常用含氯消毒剂约500mg/L；被血液等明显污染时提高浓度（约1000–2000mg/L）并先清除污物", "含氯消毒剂应现配现用、避光密闭、按规定时限使用", "遇血污直接用干纸巾擦掉即可，不必消毒", "清洁工具应分区使用、用后洗净消毒晾干，避免一块抹布擦到底"], "ans": "ABCDF", "exp": "血液体液污染存在血源性病原体传播风险，应先吸附清除污物再用适宜浓度消毒剂处理；'擦干即可'错误（E不选）。"}, {"tag": "锐器伤处理·多选", "stem": "医生配台时被疑诊患者血液污染的针头刺伤手指，正确处理是：", "opts": ["立即从近心端向远心端轻轻挤压伤口，尽可能挤出损伤处血液，禁止局部用力按压和用嘴吸吮", "在流动水下用皂液反复冲洗，再用碘伏或75%乙醇消毒、包扎", "立即报告科室院感负责人并登记暴露源、暴露方式与时间", "尽快评估暴露源HBV/HCV/HIV情况并检测暴露者基线", "HIV高风险暴露应尽早（最好2h内、不迟于72h）开始规范预防性服药并随访检测", "伤口不大，自行贴上创可贴继续手术，无需上报"], "ans": "ABCDE", "exp": "职业暴露须'一挤二冲三消毒四报告五评估用药随访'；隐瞒不报将延误HIV等阻断时机，F错。"}, {"tag": "医疗废物·多选", "stem": "口腔门诊医疗废物管理，正确的是：", "opts": ["被患者血液、唾液污染的棉签、棉球、敷料、吸唾管等放入黄色医疗废物专用包装袋", "针头、车针、刀片等损伤性废物直接投入防刺穿利器盒，装至3/4即封口", "禁止双手回套针帽、禁止徒手分拣和折弯针头", "医疗废物应分类收集、专人交接登记、集中无害化处置，不得与生活垃圾混放", "废汞（银汞合金残渣、吸出物）、显影废液等按专门要求回收，不倒入下水道", "黄色垃圾袋没装满可以先存放在走廊角落，攒几天再运"], "ans": "ABCDE", "exp": "医疗废物暂存不得超过规定时限（一般不超过2天）并有专用暂存设施，严禁随意堆放走廊、与生活垃圾混放，F错。"}]}, {"no": "病例二", "subj": "口腔预防医学", "cat": "预防宣教", "diag": "分级预防·菌斑控制·重点人群宣教", "level": "难", "time": "8分钟", "stem": [{"k": "场景", "v": "门诊开展全民健康生活方式与'健康口腔'宣教，覆盖儿童、孕妇、老年人及正畸、牙周患者。下列宣教内容与措施请判断正误。"}], "qs": [{"tag": "三级预防·单选", "stem": "为适龄儿童进行窝沟封闭、局部用氟防龋，按疾病自然史分级属于：", "opts": ["第一级预防（病因预防）", "第二级预防（早发现、早诊断、早治疗）", "第三级预防（康复、恢复功能）", "临床后期预防", "属于公共卫生应急", "不属于预防措施"], "ans": "A", "exp": "一级预防针对病因、在疾病发生前采取措施：氟化物应用、窝沟封闭、菌斑控制、饮食指导均属一级；定期检查、早期充填属二级；义齿修复、根管治疗后康复属三级。"}, {"tag": "Bass刷牙法·多选", "stem": "关于水平颤动拂刷法（Bass法），正确的是：", "opts": ["刷毛指向牙根方向、与牙长轴约呈45°角，毛尖进入龈沟", "在原位作2–3毫米的短距离水平颤动约10次，再向冠方拂刷", "按一定顺序逐组牙面面面俱到，每次刷牙不少于2分钟", "重点清洁龈缘与邻间隙，适合牙周病患者", "用大力长距离横刷以'刷得干净'", "每天至少早晚各1次，晚上那次更重要"], "ans": "ABCDF", "exp": "大力长距离横刷是错误刷牙方式，可造成楔状缺损与牙龈退缩（E错）；Bass法核心是45°入龈沟、短颤、拂刷。"}, {"tag": "邻面清洁·多选", "stem": "关于牙线与牙间隙刷，正确的是：", "opts": ["刷牙只能清除约70%左右牙面菌斑，邻面需靠牙线/间隙刷补充", "牙龈无明显退缩、邻间隙紧密者首选牙线", "牙间隙刷适用于牙周病牙龈退缩、根分叉暴露或有较大邻间隙者", "牙线通过接触点时应贴牙面上下刮动，避免暴力压伤龈乳头", "戴固定矫治器者可用正畸穿引线/牙线牵引器配合清洁", "牙缝未塞食物就说明邻面没有菌斑，无需用牙线"], "ans": "ABCD", "exp": "菌斑是不断形成的生物膜，与有无食物嵌塞无关；邻面龋、邻面菌斑必须靠牙线/间隙刷机械清除，F错。"}, {"tag": "全身用氟·多选", "stem": "关于氟化物全身应用，正确的是：", "opts": ["饮水氟化是将饮用水氟浓度调整到适宜范围（约0.7–1.0mg/L，按当地气候调整）", "饮水氟化具有突出的公共卫生意义，成本低、覆盖面广、自动防龋", "氟片/氟滴剂适用于低氟地区龋高危儿童，按年龄和饮水氟含量计算剂量，并应在家长监督下使用", "补充氟化物前必须了解当地饮水含氟量，避免重复补氟导致氟牙症", "全身用氟的防龋机制之一是形成氟磷灰石、增强釉质抗酸性", "任何地区儿童都应常规每天服用氟片，多多益善"], "ans": "ABCDE", "exp": "适量氟防龋、过量致氟斑/氟骨症；用氟必须个体化评估饮水氟与总摄氟量，严禁不评估地普遍补氟，F错。"}, {"tag": "糖与龋·多选", "stem": "关于糖摄入与龋病的宣教，符合WHO建议的是：", "opts": ["游离糖摄入量应控制在总能量的10%以下，最好进一步降至5%以下（成人约25g/天）", "致龋性与吃糖频率关系密切，应减少两餐间进糖次数、避免含糖睡前进食", "黏性强、在口内停留久的糖（奶糖、含糖安抚奶嘴、含服糖果）危害更大", "无糖口香糖中的木糖醇不能被致龋菌利用产酸，可刺激唾液再矿化", "碳酸饮料既含糖又酸，频繁饮用增加龋与酸蚀风险", "只要认真刷牙，随时吃糖、含糖奶瓶入睡都没关系"], "ans": "ABCDE", "exp": "频率控制与睡前清洁是关键；含糖奶瓶/奶睡是婴幼儿猛性龋（早发儿童龋）重要病因，刷牙不能抵消高频进糖，F错。"}, {"tag": "婴幼儿保健·多选", "stem": "婴幼儿与学龄前儿童口腔保健，正确的是：", "opts": ["第一颗乳牙萌出后6个月内、不晚于1岁应进行首次口腔检查", "3岁以下含氟牙膏用'米粒'大小（约0.1g），3–6岁用'豌豆粒'大小，由家长帮刷并防误吞", "避免含奶瓶/奶睡，1岁左右逐渐停用奶瓶、改用杯子", "乳牙萌出后即可用纱布/指套牙刷清洁，避免家长口对口喂食、共用餐具传播致龋菌", "乳磨牙窝沟较深、龋高危者3–4岁可做窝沟封闭", "乳牙迟早要换，患龋疼痛也无需治疗"], "ans": "ABCDE", "exp": "乳牙龋影响咀嚼、恒牙胚、颌面部发育与全身健康，必须早治；'乳牙不用管'是常见错误观念，F错。"}, {"tag": "孕期保健·多选", "stem": "孕妇口腔保健与孕期治疗，正确的是：", "opts": ["计划怀孕前应主动完成口腔检查，治疗龋病、牙周病与智齿隐患", "妊娠期激素变化使牙龈对菌斑反应加重，易出现妊娠期龈炎、龈瘤，更应加强菌斑控制", "孕中期（约4–6个月）是相对安全的择期口腔治疗窗口", "孕期急性剧痛、感染扩散同样应及时处理，不能一味拖延危及母婴", "确需X线检查时做好铅围裙/铅领防护，牙科小剂量投照远离盆腔", "孕期任何牙痛都必须忍到分娩后，局麻药一律不能用"], "ans": "ABCDE", "exp": "急症不可拖延；必要治疗在防护与产科沟通下可进行，酰胺类局麻药（如利多卡因）孕期可慎用，'一律忍到产后'错误，F不选。"}, {"tag": "老年与牙周维护·单选", "stem": "慢性牙周炎完成系统治疗后，长期疗效维持最关键的措施与复查间隔是：", "opts": ["无需复查，治疗一次终身治愈", "每3–6个月定期牙周维护（复治），持续自我菌斑控制", "每年洗牙一次即可，日常维护无所谓", "只靠长期口服抗生素维持", "只刷牙不复查，出血也不管", "每天用漱口水替代所有机械清洁"], "ans": "B", "exp": "牙周炎是慢性病，菌斑持续形成，须SPT牙周支持治疗（多为3–6个月）+自我口腔卫生；抗生素不能长期使用、漱口水不能替代机械清除。"}, {"tag": "正畸患者宣教·多选", "stem": "固定正畸患者的口腔健康宣教，正确的是：", "opts": ["托槽周围易堆积菌斑，好发釉质脱矿白斑和龈炎，应强调每次进食后刷牙", "可使用正畸专用牙刷、小头牙刷、间隙刷及牙线穿引线清洁弓丝下方与邻面", "减少黏性、高糖零食及含糖饮料，避免托槽脱落与龋坏", "出现结扎丝/弓丝戳嘴、托槽脱落应及时复诊处理", "可配合含氟牙膏/氟保护漆预防托槽周围脱矿", "戴上固定矫治器后无法清洁，白斑和牙龈肿是必然的，不用管"], "ans": "ABCDE", "exp": "正畸釉质脱矿和龈炎通过加强清洁与用氟多可预防，并非必然，F错。"}, {"tag": "重点人群宣教·多选", "stem": "关于口腔癌预防与早发现的健康宣教，正确的是：", "opts": ["戒烟、限酒、戒嚼槟榔是口腔癌一级预防重点", "长期口腔黏膜溃疡/白斑/红斑超过2周不愈应及时就诊活检", "避免长期残根残冠、不良修复体对舌缘、颊黏膜的慢性刺激", "人乳头瘤病毒（HPV）与部分口咽癌相关，提倡健康行为与疫苗预防", "对高危人群定期口腔检查、自我观察是二级预防", "口腔癌都是老年人才得，年轻人不必警惕"], "ans": "ABCDE", "exp": "定期检查、早发现溃疡/斑片属二级预防（E正确）；口腔癌并非老年人专属，年轻有烟酒槟榔嗜好者同样需警惕，F错。"}]}, {"no": "病例三", "subj": "口腔临床药理学与用药安全", "cat": "用药安全", "diag": "局麻·急救·抗菌药·特殊人群用药安全", "level": "难", "time": "8分钟", "stem": [{"k": "场景", "v": "门诊常用局部麻醉、抗菌、镇痛药物，并需处理过敏/中毒等突发情况。请判断下列用药与急救处理。"}], "qs": [{"tag": "局麻药极量·多选", "stem": "关于常用局麻药剂量，正确的是：", "opts": ["利多卡因一次最大剂量成人一般不超过400mg（4.4mg/kg左右）", "加入肾上腺素后利多卡因限量可适当提高（约7mg/kg）", "阿替卡因（含肾上腺素制剂）按体重控制，一般不超过约7mg/kg", "儿童、老人、肝肾功能不全者应减量并按体重计算", "注射前必须回抽无血再缓慢注射，防止直接入血", "局麻药很安全，可不用称重、不限速度、一次打满多支"], "ans": "ABCDE", "exp": "单位时间内血药浓度骤升是局麻药中毒主因：须回抽、慢注、分次、控制总量并备急救条件，F错。"}, {"tag": "肾上腺素·多选", "stem": "局麻药液中加用血管收缩剂（肾上腺素），正确的是：", "opts": ["可延缓吸收、延长麻醉时间、增强镇痛、减少术区出血和降低毒性", "常用浓度约1:100000", "可减少局麻药入血、降低中毒风险", "严重未控制高血压、近期心梗、不稳定心绞痛、严重心律失常、甲亢未控制者应慎用或不用", "注射前回抽，避免直接注入血管", "为了止血效果好，高血压患者也一律常规加用且不限量"], "ans": "ABCDE", "exp": "血管收缩剂对心血管患者需谨慎评估、限量、回抽慢注；禁忌/未控制者不用，'一律加用不限量'危险，F错。"}, {"tag": "局麻药中毒·多选", "stem": "局麻药注射中患者出现头晕耳鸣、口周麻木、烦躁、肌肉抽搐继而意识下降，正确处理有：", "opts": ["立即停止注射", "保持气道通畅、吸氧、必要时辅助通气", "惊厥者注意防护、可用咪达唑仑/地西泮控制抽搐", "出现严重心脏毒性时按急救流程处理，条件具备可使用脂肪乳剂（lipid rescue）", "监测生命体征、呼叫急救、心肺复苏准备", "马上再补注一支局麻药以'压过症状'"], "ans": "ABCDE", "exp": "这是局麻药全身毒性反应（LAST）：中枢先兴奋后抑制，处理核心是停注、气道、止痉、循环支持、脂肪乳；继续注射致死，F错。"}, {"tag": "过敏与中毒鉴别·单选", "stem": "下列表现更支持局麻药（或青霉素类）速发型过敏反应而非单纯局麻药中毒的是：", "opts": ["注射即刻全身风团、瘙痒、面唇舌肿胀、喉头紧、喘憋和血压下降", "口周麻木、耳鸣、金属异味", "肌震颤、惊厥", "与注射速度快、未回抽、剂量过大直接相关", "兴奋后嗜睡", "以中枢神经系统和心脏毒性表现为主"], "ans": "A", "exp": "皮肤黏膜症状+喉头水肿/支气管痉挛+低血压休克是过敏（IgE介导）特征；B–F多为局麻药血药浓度过高的中毒表现。"}, {"tag": "青霉素休克抢救·多选", "stem": "注射青霉素后患者突发胸闷、呼吸困难、面色苍白、血压测不出、意识淡漠，正确抢救有：", "opts": ["立即停药、平卧（可下肢抬高）、保暖、吸氧、呼叫急救", "首选0.1%肾上腺素肌内注射（常选大腿前外侧，成人约0.3–0.5mg，必要时5–15分钟重复）", "快速建立静脉通路补液扩容", "呼吸困难/喉头水肿者保持气道，必要时气管插管或切开", "可辅助使用糖皮质激素、抗组胺药，支气管痉挛用支气管扩张剂，持续心肺复苏", "先慢慢请示、等待家属到场签字后再处理"], "ans": "ABCDE", "exp": "过敏性休克抢救分秒必争，肾上腺素是首选救命药，不可因等待签字延误，F错。"}, {"tag": "双硫仑反应·单选", "stem": "患者服甲硝唑期间饮酒，出现面部潮红、头痛、心悸、恶心、血压下降，正确判断是：", "opts": ["双硫仑样反应（戒酒硫样反应），应立即停酒、对症处理，用药期间及停药后至少3天禁酒", "单纯醉酒，睡一觉即可", "青霉素过敏", "局麻药中毒", "低血糖反应", "与药物无关，可继续服药饮酒"], "ans": "A", "exp": "甲硝唑/替硝唑及部分头孢菌素抑制乙醛 const EXTRA_SETS=[{"name": "高难补充1·口内牙周（24题）", "cases": [{"no": "病例一", "subj": "牙体牙髓病学", "cat": "口内", "diag": "26慢性根尖周炎（慢性根尖脓肿）伴窦道——遗漏MB2致根管治疗失败", "level": "难", "time": "7分钟", "stem": [{"k": "患者", "v": "女，38岁，体健，无药物过敏史。"}, {"k": "主诉", "v": "左上后牙咬物隐痛3月，颊侧牙龈反复起脓疱1月。"}, {"k": "现病史", "v": "26三年前于外院行“杀神经＋根管治疗＋树脂充填”，术后偶有咬合不适未复诊。3月前咬物隐痛渐加重，1月前颊侧牙龈反复肿胀起疱，破溃流脓后自行缓解。无自发痛、夜间痛，无冷热刺激痛。"}, {"k": "口腔检查", "v": "26合面树脂充填体边缘着色、探及继发龋；叩诊（+），咬诊不适，松动（-）；颊侧前庭沟根尖区黏膜见一窦道口，压之有少量脓性分泌物溢出；牙周探诊各面≤3mm，未探及窄而深的牙周袋；冷热测均无反应。牙胶尖插入窦道拍片示踪，牙胶尖指向26近颊根尖。CBCT：近颊根根中1/3分为颊、舌两根管（Vertucci Ⅳ型），近颊第二根管（MB2）未见预备及充填影像。"}, {"k": "X线", "v": "26腭根及远颊根管内充填影像大致达根尖，近颊根仅见一根细充填影像、中下段根管影像消失；近颊根根尖周见直径约6mm、边界较清的圆形低密度影，周围骨白线欠连续。"}], "qs": [{"tag": "诊断·单选", "stem": "本例最可能的诊断是：", "opts": ["26急性根尖周炎", "26慢性根尖周炎（慢性根尖脓肿）伴窦道", "26牙周脓肿", "26残髓炎", "26牙根纵折"], "ans": "B", "exp": "解析：既往不完善根管治疗史＋咬合隐痛＋颊侧窦道反复溢脓＋牙胶尖示踪指向近颊根尖＋冷测无反应＋根尖周6mm低密度影，符合慢性根尖周炎（慢性根尖脓肿）伴窦道。A错：无自发痛、跳痛、明显叩痛松动等急性表现。C错：牙周探诊≤3mm、无窄深袋，窦口位于根尖区而非龈缘附近，牙髓无活力，不支持牙周来源。D错：残髓炎多表现为冷热刺激痛、自发隐痛等“活髓”症状，X线少有明确根尖病变；本例牙髓已无活力且有6mm根尖暗影。E错：根纵折X线常表现为沿根侧的“J形/晕状”骨吸收、孤立性窄深骨下袋，本例不具备。"}, {"tag": "失败原因与遗漏根管·多选", "stem": "关于本例治疗失败原因及MB2的探寻，正确的有：", "opts": ["上颌第一磨牙近颊根双根管发生率高（文献报告约60%~90%以上），遗漏MB2是其根管治疗失败最常见的原因之一", "CBCT示近颊根为Vertucci Ⅳ型（2-2型），即两根管、两根尖孔", "MB2根管口常位于近颊主根管口与腭根管口连线的近中侧、髓底发育沟附近", "肉眼直视即可发现所有MB2根管口，无需任何辅助设备", "X线偏移投照（近中或远中水平角）有助于分开重叠的根管影像，辅助判断根管数目", "超声工作尖修整髓底发育沟、手术显微镜照明放大及亚甲蓝染色均可提高MB2检出率"], "ans": "ABCEF", "exp": "解析：D错——MB2根管口常细小、被继发牙本质或髓底钙化覆盖，仅凭肉眼直视极易遗漏，文献报告未用放大设备时上颌第一磨牙MB2检出率明显低于显微镜组；临床应结合显微镜、超声、染色、CBCT及偏移投照综合定位。Vertucci Ⅳ型=2-2型（根管口至根尖为两个独立根管、两个根尖孔）。"}, {"tag": "窦道与鉴别诊断·多选", "stem": "关于窦道的检查与鉴别，正确的有：", "opts": ["牙胶尖插入窦道后拍片示踪，是判断窦道来源牙位的可靠方法", "仅凭X线影像即可准确区分根尖周肉芽肿与根尖周囊肿", "牙周脓肿与根尖脓肿的鉴别要点包括牙髓活力、有无窄深牙周袋、窦口位置（龈缘附近vs根尖区）及骨吸收形态", "本例探诊≤3mm、牙髓无活力、示踪指向根尖，支持根尖来源", "窦道形成说明患牙无保留价值，应直接拔除", "完善根管再治疗后肉芽肿类病变多可愈合；若疑真性囊肿且保守治疗不愈，可行根尖手术并送病理"], "ans": "ACDF", "exp": "解析：B错——X线（含CBCT）无法可靠区分根尖周肉芽肿与囊肿，边界清、有骨白线、直径大（>10mm）仅提示囊肿可能性高，确诊靠组织病理；真性囊肿有独立囊腔、上皮衬里，可能不随根管治疗愈合。E错——慢性根尖周炎伴窦道多数经完善根管（再）治疗可愈合，窦道并非拔牙指征；本例牙体长度、骨支持尚可，应首选再治疗保留。"}, {"tag": "再治疗操作与冲洗·多选", "stem": "行根管再治疗时，下列操作正确的有：", "opts": ["全程在橡皮障隔离下进行，防止器械误吞误吸及冲洗液刺激黏膜", "去除旧根充物可用机用再治疗锉配合溶剂（如桉油类）软化牙胶，先建立直线通路", "次氯酸钠常用有效浓度0.5%~5.25%，兼具杀灭微生物与溶解有机残髓组织的作用", "次氯酸钠与氯己定可随意混合、交替冲洗以增强杀菌效果", "17%EDTA可螯合去除玷污层中的无机成分，与次氯酸钠交替使用，终末冲洗常选EDTA＋次氯酸钠", "遇根管阻塞/台阶时，可用预弯的8#或10#K锉蘸含EDTA的润滑膏轻柔捻转探查，绕过阻塞段"], "ans": "ABCEF", "exp": "解析：D错——次氯酸钠与氯己定混合会生成橙棕色沉淀（含对氯苯胺，有细胞毒性），堵塞牙本质小管并影响封闭；如需交替使用，中间须用生理盐水或EDTA充分冲洗间隔。次氯酸钠冲洗需配合橡皮障并避免加压冲出根尖孔（可致“次氯酸钠事故”：剧烈疼痛、肿胀、出血）。建立绕过台阶的通路后逐级扩大、大量冲洗防碎屑再阻塞。"}, {"tag": "工作长度与器械分离·多选", "stem": "关于工作长度确定及术中器械分离的处理，正确的有：", "opts": ["工作长度的止点为根尖狭窄处，通常距X线片根尖0.5~1mm", "根尖狭窄处距解剖根尖孔约0.5mm，相当于牙本质牙骨质界，是预备与充填的生理性止点", "电子根测仪应结合插锉X线片使用，干燥根管、根尖孔开放或金属修复体接触时可致读数误差", "器械分离后一律必须手术取出，否则治疗必然失败", "分离器械位于根尖1/3、无法建立旁路且症状持续者可行根尖手术；无症状者经充分消毒严密充填后可定期随访", "超声工作尖在显微镜下于分离器械周围形成旁隙是常用取出方法，需控制牙本质切削量以防侧穿"], "ans": "ABCEF", "exp": "解析：D错——分离器械的处理原则为“能取则取、能旁路则旁路、否则消毒充填后随访”：发生于预备早期、感染未控制、位于根中上段者尽量取出或建立旁路；若位于根尖1/3、根管已充分扩大消毒、无症状者，严密充填后随访预后仍较好；仅当病变不愈或症状持续时考虑根尖手术。C中根测仪单独依赖亦错误，故“结合使用”为正确表述。"}, {"tag": "医源性穿孔修补·多选", "stem": "术中超声探查髓底发育沟时不慎致髓室底近中约1mm穿孔（位于牙槽嵴顶以上，未与龈沟交通），正确处理有：", "opts": ["新鲜医源性穿孔应尽量立即修补，延迟修补因细菌污染预后明显变差", "首选生物陶瓷类材料（MTA/iRoot BP）修补，生物相容性好、封闭性强并可诱导硬组织形成", "以3%过氧化氢加压冲洗穿孔区，彻底消毒后再修补", "用无菌生理盐水或次氯酸钠棉球轻压止血，避免将血凝块压入穿孔道", "MTA凝固需数小时（约2.5~4小时），修补后其上置湿棉球暂封保持湿润，或即刻以玻璃离子覆盖保护", "位于牙槽嵴顶以上、未与龈沟交通的小穿孔，预后优于嵴顶以下或与口腔交通的穿孔"], "ans": "ABDEF", "exp": "解析：C错——过氧化氢及大量次氯酸钠经穿孔冲出可损伤牙周组织、引起持续出血甚至皮下气肿，穿孔区冲洗应选用无菌生理盐水、动作轻柔。修补要点：隔湿止血后输送MTA压实（避免超填至根分叉过多），维持湿润环境使其凝固；嵴顶以下穿孔易与龈沟交通形成牙周破坏，预后差，必要时结合翻瓣修补或牙周手术。"}]}, {"no": "病例二", "subj": "牙体牙髓病学", "cat": "口内", "diag": "11复杂冠折（露髓，年轻恒牙）；21完全脱位", "level": "难", "time": "7分钟", "stem": [{"k": "患者", "v": "男，9岁，学生，家长代诉病史。否认全身疾病及药物过敏史，百白破疫苗按计划接种，近5年未加强。"}, {"k": "主诉", "v": "跌倒致上前牙折断、脱落2小时。"}, {"k": "现病史", "v": "2小时前跑步时面部着地摔倒，11折断、断面出血，21完全脱出牙槽窝，家长捡起牙齿后置入鲜牛奶中保存携来就诊。否认伤后意识丧失、呕吐、头痛。"}, {"k": "口腔检查", "v": "11冠折，断面累及釉质及牙本质，露髓孔约1.5mm，探痛（+），渗血鲜红；叩（±），松动（-），龈缘无撕裂。21牙槽窝空虚、内见血凝块；脱出牙牙体完整，根面附少量污物。12、22叩（-）、松（-）。咬合无明显创伤。"}, {"k": "X线", "v": "11未见根折线及根尖暗影，牙根形成约2/3~3/4，根尖孔开放呈喇叭口（约Nolla 9期）；21牙根发育完成、根尖孔闭合（Nolla 10期），牙槽窝及唇侧骨板未见骨折线。"}], "qs": [{"tag": "11诊断·单选", "stem": "11最可能的诊断是：", "opts": ["简单冠折（未露髓）", "复杂冠折（露髓）", "冠根折", "根折", "牙震荡"], "ans": "B", "exp": "解析：冠折断面累及釉质、牙本质并有约1.5mm露髓孔，符合复杂冠折定义。A错：已有明确露髓。C错：X线未见折线延伸至龈下根面，断面位于龈上。D错：X线未见根折线，松动（-）。E错：牙震荡无牙体硬组织缺损，仅有牙周膜损伤表现。注意：初诊一张X线片不能完全排除细小根折，需结合松动度、叩诊并随访复查。"}, {"tag": "11首选处理·单选", "stem": "针对11目前的首选处理是：", "opts": ["直接盖髓术", "部分活髓切断术（Cvek活髓切断）", "局麻下拔髓、即刻根管治疗", "根尖诱导成形术", "拔除患牙"], "ans": "B", "exp": "解析：露髓孔约1.5mm（>1mm）、伤后2小时就诊、污染轻、牙根发育未完成（根尖孔开放呈喇叭口）——应行部分活髓切断术，去除表层1~2mm感染牙髓，保存根部活髓以促使牙根继续发育、根尖孔闭合。A错：直接盖髓仅适用于针尖大小（<1mm）、时间短、清洁的露髓。C错：拔髓将使牙根停止发育，根壁薄弱易折，年轻恒牙应尽可能保活髓。D错：根尖诱导成形用于牙髓已坏死/无法保存活髓的根尖孔开放牙，本例活髓尚存。E明显错误。"}, {"tag": "活髓切断操作要点·多选", "stem": "11行部分活髓切断术，正确的操作有：", "opts": ["局麻下上橡皮障，去净折裂面污染及无基釉", "高速无菌金刚砂车针充分水冷却下磨除露髓孔下方约1~2mm冠髓，至断面出血鲜红、生理盐水棉球轻压数分钟可止", "以甲醛甲酚（FC）小棉球置于断面烧灼止血，兼诱导修复性牙本质", "断面覆盖氢氧化钙或MTA/生物陶瓷类盖髓剂，玻璃离子水门汀垫底后复合树脂严密修复断面", "术后1、3、6、12个月复查牙髓活力、钙化桥形成及牙根继续发育情况", "若术后出现牙髓坏死或根尖病变，改行根尖诱导成形术或牙髓血运重建"], "ans": "ABDEF", "exp": "解析：C错——FC具有组织固定及细胞毒性，会破坏残余牙髓、增加牙内吸收风险，年轻恒牙活髓切断禁用FC，现已被氢氧化钙、MTA等取代。止血判断是关键：断面出血暗红、加压不止提示冠髓感染深，应追加去除牙髓深度（颈部活髓切断）甚至改根尖诱导；出血鲜红易止方可盖髓。严密封闭防微渗漏是活髓保存成功的前提。"}, {"tag": "脱位牙再植急救·多选", "stem": "关于21完全脱位的现场处理与再植，正确的有：", "opts": ["手持牙冠部操作，避免触碰根面牙周膜", "根面污物用生理盐水轻柔冲洗，不可搔刮根面、不可用消毒液浸泡", "口外干燥时间超过60分钟，根面牙周膜细胞多已坏死，预期将发生替代性吸收", "脱出牙可用鲜牛奶、Hanks平衡盐溶液、生理盐水或含于口腔颊沟（唾液）中暂存，切忌干燥保存", "自来水来源方便，是脱出牙理想的长时间保存介质", "生理盐水轻冲牙槽窝血凝块后轻压复位，再植越早越好，黄金时间为脱出后30分钟内"], "ans": "ABCDF", "exp": "解析：E错——自来水为低渗液体，长时间浸泡使牙周膜细胞水肿坏死，仅可用于短暂冲洗污物，不能作为保存介质。介质渗透压排序：Hanks液最佳，牛奶、生理盐水次之，唾液再次，干燥保存最差；本例牙齿置牛奶中约2小时方就诊，属延迟再植，预后欠佳，须向家长交代替代性吸收风险。"}, {"tag": "固定与全身用药·多选", "stem": "21再植后关于固定与用药，正确的有：", "opts": ["采用弹性（半刚性）夹板固定，保持生理性动度以利于牙周膜功能性愈合", "常规弹性固定2周；口外干燥时间>60分钟的延迟再植或伴牙槽骨骨折者延长至4周", "本例9岁患儿全身抗生素首选多西环素", "12岁以下患儿宜选阿莫西林按体重给药7天，用前询问过敏史", "结合免疫接种史给予破伤风抗毒素或类毒素", "固定期间进软食、0.12%氯己定含漱约1周控制菌斑，避免对抗性运动"], "ans": "ABDEF", "exp": "解析：C错——四环素类可致发育中牙齿着色及牙釉质发育异常，IADT指南推荐多西环素仅用于12岁以上（首日200mg，后100mg每日一次共7天）；12岁以下首选阿莫西林（按体重20~40mg/kg/d分次口服7天）。刚性固定会增加骨粘连/替代性吸收风险，故强调弹性固定；固定时间过长同样不利于牙周愈合。"}, {"tag": "再植牙髓处理与并发症·多选", "stem": "关于21再植后的牙髓处理及并发症监测，正确的有：", "opts": ["21根尖孔已闭合，血运重建可能性极小，应于再植后7~10天（2周内）拔髓行根管治疗，氢氧化钙暂封", "若脱位牙为根尖孔开放牙，可暂不处理牙髓、密切观察血运重建，一旦出现坏死或炎症性吸收再干预", "炎症性根吸收表现为根面碟状缺损伴根尖区暗影，一经发现应立即完善根管治疗并封入氢氧化钙", "替代性吸收（骨粘连）表现为叩诊高调金属音、动度消失、牙周膜间隙消失，可通过根管治疗逆转", "延迟再植（干燥时间>60分钟）者几乎不可避免替代性吸收，青少年患者可致局部牙槽突高度发育受限", "复查时间点为2周（拆夹板）、4周、3、6、12个月及此后每年，监测活力、松动度、叩诊音调及X线改变"], "ans": "ABCEF", "exp": "解析：D错——替代性吸收是牙根被骨组织进行性替代（骨粘连），无有效治疗方法，根管治疗不能逆转；青少年患者随颌骨发育患牙出现“下沉”、牙槽突垂直向发育不足，需早期制定修复/正畸预案（如去冠保留根片、自体牙移植或成年后修复）。炎症性吸收与替代性吸收为最常混淆的两个二级结论：前者由感染牙髓经牙本质小管刺激引起、根管治疗可控制，后者与牙周膜坏死相关、不可逆。"}]}, {"no": "病例一", "subj": "牙周病学", "cat": "牙周", "diag": "广泛型侵袭性牙周炎", "level": "难", "time": "7分钟", "stem": [{"k": "患者", "v": "女，26岁，职员。其母40余岁即因牙齿松动脱落致全口多牙缺失。"}, {"k": "主诉", "v": "全口多牙松动、咀嚼无力1年余，加重3个月。"}, {"k": "现病史", "v": "近1年自觉上下前牙及多颗后牙逐渐松动、移位，前牙出现间隙，偶有刷牙出血。自恃年轻未诊治。口腔卫生习惯尚可，每日刷牙2次。无系统性疾病史，不吸烟。"}, {"k": "口腔检查", "v": "口腔卫生较好，菌斑、牙石量少，牙龈炎症较轻，与牙周破坏程度明显不相称；BI 2～3。上下切牙及四个第一磨牙PD 6～8mm，CAL 6～9mm，松动II～III度；其余多颗后牙PD 4～6mm，CAL 3～5mm；全口多数位点探诊出血（BOP+）。11、21之间出现间隙，上前牙唇向移位。"}, {"k": "X线", "v": "曲面断层示切牙区及第一磨牙区牙槽骨呈弧形（角形/垂直型）吸收，达根长1/2～2/3（＞1/2）；其余牙位牙槽骨普遍水平型吸收，达根长1/3～1/2。"}], "qs": [{"tag": "诊断·单选", "stem": "本例最可能的诊断是：", "opts": ["局限型侵袭性牙周炎", "慢性牙周炎（中度）", "广泛型侵袭性牙周炎", "坏死性溃疡性牙周炎", "慢性龈炎"], "ans": "C", "exp": "患者26岁，病变除切牙-第一磨牙典型部位外，已累及全口多数后牙（≥3颗非切牙/第一磨牙），属广泛型侵袭性牙周炎。A错：局限型病变局限于切牙和第一磨牙，余牙受累不超过2颗；B错：年龄（26岁）与严重破坏程度不符、局部刺激物少，不符合慢性牙周炎；D错：无龈乳头坏死、溃疡、假膜及腐败性口臭；E错：已有附着丧失和骨吸收，绝非龈炎。"}, {"tag": "诊断依据·多选", "stem": "支持本例诊断的依据有：", "opts": ["发病年龄小（26岁）而牙周破坏严重，提示病变进展迅速", "菌斑牙石量少、牙龈炎症轻，局部刺激物与组织破坏程度不成比例", "切牙与第一磨牙区呈弧形（角形）骨吸收的典型分布模式", "母亲有类似病史，提示家族聚集性", "必须经微生物学检查检出伴放线聚集杆菌方可确立诊断"], "ans": "ABCD", "exp": "四项均为侵袭性牙周炎的核心特征：年轻发病、进展快；局部因素与破坏不相称；切牙-第一磨牙弧形吸收模式；家族聚集倾向。E错：微生物学检测有助于评估和用药参考，但非诊断必需条件，诊断依据临床表现＋X线＋家族史综合判断。"}, {"tag": "优势致病菌·单选", "stem": "侵袭性牙周炎（尤其局限型）关系最密切的优势致病菌是：", "opts": ["伴放线聚集杆菌（放线共生放线杆菌，Aa）", "牙龈卟啉单胞菌（Pg）", "中间普氏菌（Pi）", "变形链球菌", "福赛坦氏菌（Tf）"], "ans": "A", "exp": "Aa与侵袭性牙周炎高度相关，局限型患者中检出率高，其高毒力JP2克隆株可产生白细胞毒素损伤中性粒细胞。B错：Pg主要与慢性牙周炎相关；C错：Pi与妊娠期龈炎及慢性牙周炎相关；D错：变形链球菌为主要致龋菌；E错：Tf属慢性牙周炎红色复合体成员。"}, {"tag": "鉴别诊断·多选", "stem": "关于侵袭性牙周炎与慢性牙周炎的鉴别，正确的有：", "opts": ["慢性牙周炎多见于35岁以上成人，进展缓慢；侵袭性牙周炎多见于30岁以下，进展迅速", "侵袭性牙周炎局部刺激物量与破坏程度不成比例，慢性牙周炎基本成比例", "侵袭性牙周炎常有家族聚集性，慢性牙周炎不明显", "慢性牙周炎骨吸收以水平型为主，侵袭性牙周炎常见垂直（角形）型骨吸收", "二者鉴别的关键在于是否存在附着丧失"], "ans": "ABCD", "exp": "四项均为两病鉴别要点。E错：两病均存在附着丧失与骨吸收；有无附着丧失是牙龈炎与牙周炎的鉴别要点，而非慢性与侵袭性牙周炎的鉴别点。"}, {"tag": "治疗原则·多选", "stem": "本例合理的治疗措施包括：", "opts": ["全口龈上洁治、龈下刮治和根面平整（SRP）作为一线基础治疗", "SRP同时联合口服阿莫西林＋甲硝唑，可提高疗效（针对Aa）", "所有松动牙均须先行根管治疗", "告知患者本病易复发，需长期维护治疗", "急性炎症期应即刻拔除全部III度松动牙"], "ans": "ABD", "exp": "SRP是基础；Aa可侵入牙周组织，单纯机械治疗难以清除，联合阿莫西林＋甲硝唑可显著提高疗效；侵袭性牙周炎复发风险高，须强调维护。C错：患牙牙髓多不受累，不需常规根管治疗；E错：III度松动牙应先评估保留价值，基础治疗后部分可好转，绝非即刻全拔。"}, {"tag": "再评估与维护·多选", "stem": "关于本例基础治疗后的再评估与维护，正确的有：", "opts": ["SRP完成后4～6周行牙周再评估，复查PD、BOP、CAL及松动度", "再评估时PD≥5mm且探诊出血的位点，可考虑翻瓣术或引导性组织再生术（GTR）等进一步治疗", "维护期复查间隔一般为3个月", "推荐水平颤动拂刷法（改良Bass法），配合牙线/牙间隙刷控制菌斑", "治疗结束后每12个月复查一次即可"], "ans": "ABCD", "exp": "再评估4～6周是组织愈合（结合上皮修复）所需的常规周期；深袋残余位点需手术干预；侵袭性牙周炎维护期通常为3个月；改良Bass法是标准刷牙方法。E错：12个月间隔过长，侵袭性牙周炎复发快，维护期应每3个月复查，依病情可缩短至1～2个月。"}]}, {"no": "病例二", "subj": "牙周病学", "cat": "牙周", "diag": "牙周-牙髓联合病变（牙髓源性）伴根分叉病变（Glickman II度）", "level": "难", "time": "7分钟", "stem": [{"k": "患者", "v": "男，48岁，个体户。吸烟20年，每日约20支。"}, {"k": "主诉", "v": "左下后牙反复肿痛半年，近3天加重伴局部溢脓。"}, {"k": "现病史", "v": "左下后牙半年前因深龋出现自发痛，未治疗，后疼痛自行缓解；此后该牙咬合不适，左下后牙区牙龈反复肿胀，自服抗生素可暂时缓解。3天前肿痛再发，咀嚼时加重。"}, {"k": "口腔检查", "v": "46远中合面深龋及髓，探（−），冷热诊及电活力测试均无反应；叩痛（+），松动II度；颊侧近龈缘处肿胀隆起，压痛明显，压之有脓液自牙周袋内溢出。46近中PD 7mm，颊侧中央PD 8mm，探针可水平探入根分叉区但未贯通对侧；CAL 6mm，BI 3。全口普遍PD 3～5mm，牙石（++），牙龈暗红。"}, {"k": "X线", "v": "46根尖周透射影约4mm×5mm，根分叉区透射影，近中根周牙槽骨角形吸收达根长1/2；全口牙槽骨普遍水平型吸收达根长1/3。"}], "qs": [{"tag": "诊断·单选", "stem": "46最可能的诊断是：", "opts": ["急性牙周脓肿（原发性牙周病变）", "急性根尖周脓肿（单纯牙髓源性）", "牙周-牙髓联合病变（牙髓坏死继发牙周破坏）", "坏死性溃疡性牙周炎", "慢性龈乳头炎"], "ans": "C", "exp": "46牙髓坏死（活力测试无反应）＋根尖周及根分叉透影＋与之相通的深牙周袋（PD 8mm、CAL 6mm），符合牙髓源性病变经根尖/根分叉途径破坏牙周组织形成的牙周-牙髓联合病变。A错：原发牙周脓肿患牙牙髓多有活力，且无深龋及髓；B错：单纯根尖周脓肿肿胀多位于根尖区前庭沟，不应有与袋相通的深牙周袋；D错：无龈乳头坏死、假膜；E错：龈乳头炎无附着丧失及根尖病变。"}, {"tag": "感染交通途径·多选", "stem": "牙髓组织与牙周组织之间的解剖交通途径包括：", "opts": ["根尖孔（最主要的交通途径）", "侧支根管（包括根分叉区副根管）", "牙本质小管（牙骨质缺损、釉突/釉珠处）", "牙根纵折的折裂线", "牙周膜血管吻合网血行播散"], "ans": "ABCD", "exp": "根尖孔是主要通道；侧支根管/副根管（磨牙根分叉区多见）可致根分叉病变；牙本质小管在牙骨质缺损处可交通；牙根纵折折裂线亦为感染通道。E错：牙髓-牙周交通为解剖性管道，而非血行播散途径。"}, {"tag": "鉴别诊断·多选", "stem": "关于牙周脓肿与根尖周脓肿的鉴别要点，正确的有：", "opts": ["牙周脓肿肿胀多靠近龈缘，根尖周脓肿肿胀多位于根尖区（前庭沟附近）", "牙周脓肿患牙牙髓多有活力，根尖周脓肿患牙牙髓多已坏死", "牙周脓肿X线多见牙槽嵴及根周骨吸收，根尖周脓肿多见根尖区透射影", "根尖周脓肿多有深龋、牙髓治疗或外伤史", "牙周脓肿以垂直向叩痛为主，根尖周脓肿以侧向叩痛为主"], "ans": "ABCD", "exp": "四项均为经典鉴别点。E错：方向恰好相反——牙周脓肿病变来自侧方牙周组织，侧向叩痛明显；根尖周脓肿病变位于根尖，垂直向叩痛明显。"}, {"tag": "根分叉分度·单选", "stem": "本例46探针可水平探入根分叉区但未贯通对侧，按Glickman分度属于：", "opts": ["I度", "II度", "III度", "IV度", "无法分度"], "ans": "B", "exp": "Glickman分度：I度为早期，探针可探及根分叉凹入但不能深入；II度探针可水平探入根分叉内但不贯通（部分骨破坏）；III度探针可完全贯通颊舌向，但被牙龈覆盖；IV度贯通且根分叉暴露、直视可见。本例为II度。III/IV度的关键区别在于是否暴露可见，而非探诊差异。"}, {"tag": "治疗顺序·单选", "stem": "本例46合理的治疗顺序是：", "opts": ["先行根管治疗控制牙髓感染，再行牙周基础治疗，4～6周后评估牙周反应", "先行翻瓣手术，再行根管治疗", "仅行根管治疗，无需牙周处理", "仅行牙周基础治疗，牙髓保留观察", "即刻拔除患牙后种植修复"], "ans": "A", "exp": "牙髓源性联合病变，牙髓感染为始动因素，应先完成根管治疗，再行SRP；牙髓源性牙周破坏在感染控制后多有较好愈合，故4～6周再评估后决定是否需进一步牙周手术。B错：顺序颠倒；C错：深袋及根分叉病变需牙周处理；D错：牙髓已坏死，不可观察；E错：Glickman II度根分叉病变经规范治疗预后尚可，有保留价值。"}, {"tag": "综合治疗·多选", "stem": "本例合理的综合治疗措施包括：", "opts": ["急性期开髓引流＋脓肿切开引流，伴全身症状时辅以抗生素", "46行完善的根管治疗", "全口牙周基础治疗（SRP）并强化菌斑控制（牙石++）", "根管治疗＋SRP后4～6周再评估，若根分叉病变持续，可考虑翻瓣术、引导性组织再生术（GTR）等", "46根分叉II度病变应首选即刻截根术"], "ans": "ABCD", "exp": "急性期先引流缓解症状；病因治疗为RCT＋SRP；再评估后残余病变可手术干预，GTR对II度根分叉病变有一定适应证。E错：截根术主要适用于上颌磨牙III～IV度根分叉病变且其余牙根健康者；II度病变应先保守/再生治疗，即刻截根属过度治疗。"}]}]}, {"name": "高难补充2·黏膜人文（24题）", "cases": [{"no": "病例一", "subj": "口腔黏膜病学", "cat": "黏膜", "diag": "口底-舌腹颗粒型口腔白斑伴上皮异常增生", "level": "难", "time": "7分钟", "stem": [{"k": "患者", "v": "男，56岁，吸烟30余年（约20支/日），喜饮烈酒。"}, {"k": "主诉", "v": "舌腹白色斑块半年，近1个月自觉增厚、粗糙。"}, {"k": "现病史", "v": "半年前无意中发现左侧舌腹发白，无疼痛，未诊治。近1个月斑块范围扩大、表面变粗糙，偶有灼痛。自用盐水漱口无效。无发热，体重无明显下降。"}, {"k": "口腔检查", "v": "左侧舌腹延及口底可见约2.5cm×1.5cm白色斑块，边界欠清，不能擦去；表面呈大小不等的颗粒状突起，间有充血发红区域，局部可触及轻度硬结；45残根，边缘锐利正对病损区。颌下可及一枚约1cm淋巴结，质中、活动、轻压痛。"}, {"k": "辅助检查/病理", "v": "甲苯胺蓝局部染色阳性（着深蓝色）；活检病理：上皮不全角化，上皮钉突肥大，上皮层下2/3可见细胞非典型性、核深染、极性紊乱，固有层慢性炎细胞浸润——诊断：白斑伴中度上皮异常增生。"}], "qs": [{"tag": "诊断·单选", "stem": "结合病史与检查，本例最可能的诊断是：", "opts": ["均质型口腔白斑", "颗粒型（非均质型）口腔白斑", "口腔红斑", "白色角化病", "白色水肿", "急性假膜型念珠菌病"], "ans": "B", "exp": "白色、不能擦去、表面颗粒状突起并间有充血区，为颗粒型白斑典型表现，属非均质型。A均质型表面应平坦均一；C红斑以鲜红丝绒状为主、白色少；D白色角化病与刺激因素对应、去刺激可消退，且不会出现颗粒增生与硬结；E白色水肿双颊对称、牵拉后白色变浅；F假膜型念珠菌病白色斑膜可被擦去。"}, {"tag": "恶变危险因素·多选", "stem": "关于白斑恶变的高危因素，正确的有：", "opts": ["发生于舌腹-口底、软腭-咽前柱等“危险区”者恶变率明显升高", "非均质型（颗粒型、疣状型、溃疡型）较均质型恶变率高", "病理伴中、重度上皮异常增生者恶变风险显著增加", "合并白色念珠菌感染的白斑恶变倾向增高", "不吸烟的女性特发性白斑患者恶变倾向反而较高", "均质型、小面积白斑恶变率最高"], "ans": "ABCDE", "exp": "F错：恶变风险恰恰以非均质型、位于危险区者为高，均质型小面积白斑相对较低。A、B为最重要的两项临床预警因素；D念珠菌感染与白斑恶变相关；E不吸烟女性白斑患者病因不明、恶变率相对更高，属经典考点。"}, {"tag": "活检指征·多选", "stem": "本例提示必须活检的“危险信号”包括：", "opts": ["病损位于舌腹-口底危险区", "出现颗粒状增生、表面粗糙", "扪及局部硬结，提示浸润可能", "病损近期迅速增大、增厚", "去除刺激因素（调磨残根、戒烟酒）观察2～4周无消退", "白色病损不能擦去即属恶性，无须活检"], "ans": "ABCDE", "exp": "A-D均为本例已具备的警报征象；E为处理原则：可疑白斑先去刺激观察2～4周，不消退者活检。F错：不能擦去只说明符合白斑的临床定义，白斑是排除性临床诊断，不等于癌，确诊须靠病理。"}, {"tag": "鉴别诊断·多选", "stem": "下列白色病损鉴别要点，正确的有：", "opts": ["迷脂症为颊黏膜散在淡黄色小颗粒，系异位皮脂腺，无恶变倾向", "白色水肿多见于双颊，对称，牵拉黏膜后白色变浅或消失", "白色角化病与局部机械/化学刺激部位相对应，去除刺激后可消退", "急性假膜型念珠菌病的白色斑膜可被棉签擦去，露出充血糜烂面", "口腔扁平苔藓多为双侧对称，可见珠光白色Wickham网纹", "均质型白斑的白色病损可轻易擦去"], "ans": "ABCDE", "exp": "F错：白斑的白色斑块不能被擦去，可与假膜型念珠菌病鉴别，此为白斑定义性特征之一。A-E均为各病损的经典鉴别点，需与白斑严格区分后方可下“白斑”诊断（排除性诊断）。"}, {"tag": "病理分级·多选", "stem": "关于白斑病理与上皮异常增生，正确的有：", "opts": ["上皮异常增生按非典型细胞累及上皮层厚度分级：下1/3为轻度、达2/3为中度、超过2/3或累及全层为重度（原位癌）", "重度上皮异常增生/原位癌应按鳞癌的处理原则治疗", "本例病理（下2/3非典型性）属中度上皮异常增生", "白斑的病理改变可仅为上皮单纯增生，也可伴不同程度异常增生", "“白斑”一词本身即代表癌前病变，镜下必见上皮异常增生", "颗粒型白斑病理常见不全角化伴上皮钉突肥大增生"], "ans": "ABCDF", "exp": "E错：白斑是临床诊断名词，多数白斑病理仅表现为上皮单纯增生（过度角化、棘层增生），伴异常增生者仅占一部分；因此白斑属“口腔潜在恶性疾患”而非镜下必见异型。A为分级标准，B为处理原则，C对应本例，D、F描述正确。"}, {"tag": "处理与随访·多选", "stem": "本例的处理与随访策略，正确的有：", "opts": ["立即戒烟戒酒、拔除或调磨45残根等刺激因素", "因位于危险区、颗粒型并扪及硬结，活检明确病理是首要步骤", "中度异常增生可行手术完整切除（或激光），切缘送病理", "术后定期随访，伴异常增生者宜每3～6个月复查，警惕复发与恶变", "局部可辅助应用维A酸制剂，但停药后易复发、不能替代随访", "确诊白斑伴异常增生经切除后即可视为治愈，无须再随访"], "ans": "ABCDE", "exp": "F错：白斑切除后仍有复发与恶变可能，须终身定期随访，绝不能视为一劳永逸。A去除刺激是所有白色病损处理的第一步；B本例警报征象多，不应只观察；C中度以上异常增生主张完整切除并明确切缘；D随访间隔按病理分级掌握；E维A酸类可逆转部分角化但停药复发率高，仅为辅助。"}]}, {"no": "病例二", "subj": "口腔黏膜病学", "cat": "黏膜", "diag": "糜烂型口腔扁平苔藓伴皮肤、指甲损害", "level": "难", "time": "7分钟", "stem": [{"k": "患者", "v": "女，48岁，更年期，近半年精神焦虑，睡眠差。"}, {"k": "主诉", "v": "双颊黏膜发白伴进食刺激痛1年，加重1个月。"}, {"k": "现病史", "v": "1年前发现双颊黏膜白色条纹，进食辛辣、烫食时疼痛。1个月前右侧颊黏膜出现破溃、灼痛明显。发病以来腕部、踝部皮肤反复出现紫红色瘙痒性丘疹，指甲变形。曾按“口腔溃疡”自服维生素无效。"}, {"k": "口腔检查", "v": "双侧颊黏膜沿咬合线对称分布珠光白色细条纹，交织成网状（Wickham纹）；右侧颊黏膜中部见约1.0cm×0.8cm糜烂面，充血，覆少量假膜，触痛明显。双侧龈缘充血呈带状发红。前腕部皮肤散在紫红色多角形扁平丘疹；拇指甲板见纵嵴，部分甲板萎缩呈翼状。"}, {"k": "辅助检查/病理", "v": "活检：上皮不全角化，基底细胞液化变性，上皮钉突呈锯齿状，固有层浅部淋巴细胞呈带状浸润，可见胶样小体（Civatte小体）；直接免疫荧光：基底膜区纤维蛋白原沉积，胶样小体IgM阳性。"}], "qs": [{"tag": "诊断·单选", "stem": "本例最可能的诊断是：", "opts": ["糜烂型口腔扁平苔藓", "均质型口腔白斑", "慢性盘状红斑狼疮", "黏膜良性类天疱疮", "寻常型天疱疮", "苔藓样反应"], "ans": "A", "exp": "双颊对称Wickham网纹+糜烂+皮肤紫红色多角形扁平丘疹+指甲损害，为扁平苔藓经典表现。B白斑无网纹与皮肤损害；C盘状红斑狼疮好发于下唇、白纹呈放射状从中央萎缩区向外排列，与本例不同；D类天疱疮以大疱和瘢痕为主；E天疱疮为松弛性大疱、Nikolsky征阳性；F苔藓样反应与银汞充填体或药物相关，去除诱因后消退，本例无此诱因且伴典型皮肤指甲损害。"}, {"tag": "诊断依据·多选", "stem": "支持本例诊断的临床表现有：", "opts": ["双颊对称分布的珠光白色Wickham网纹", "皮肤紫红色、多角形、扁平、瘙痒性丘疹（可概括为4P/6P特征）", "指甲纵嵴、甲板翼状萎缩（甲胬肉样改变）", "搔抓或外伤部位出现新损害（同形反应/Koebner现象）", "牙龈充血呈带状发红（剥脱性龈炎样表现）", "口腔损害必为单侧、不对称分布"], "ans": "ABCDE", "exp": "F错：对称性恰恰是扁平苔藓的重要特征，单侧不对称白色病损更应警惕白斑或苔藓样反应。A-E均为扁平苔藓的典型临床依据，皮肤、指（趾）甲损害可与口腔损害同时或先后出现。"}, {"tag": "病理·多选", "stem": "关于本病病理与免疫病理，正确的有：", "opts": ["上皮基底细胞液化变性", "固有层浅部淋巴细胞呈致密的带状浸润", "可见胶样小体（Civatte小体/嗜酸性小体），系凋亡的角朊细胞", "上皮钉突可呈锯齿状，上皮可过角化或萎缩", "直接免疫荧光见基底膜带IgG、C3呈连续线状沉积是其确诊依据", "棘层松解、上皮内疱形成为其特征性改变"], "ans": "ABCD", "exp": "E错：基底膜带IgG、C3线状沉积是瘢痕性类天疱疮的免疫荧光特征；扁平苔藓主要为纤维蛋白原在基底膜区沉积、胶样小体IgM阳性，且直接免疫荧光主要用于与类天疱疮、红斑狼疮鉴别而非确诊。F错：棘层松解、上皮内疱是天疱疮的病理特征；扁平苔藓属界面炎症，无棘层松解。"}, {"tag": "鉴别诊断·多选", "stem": "关于本病需鉴别的疾病及其要点，正确的有：", "opts": ["慢性盘状红斑狼疮口腔损害好发于下唇，中央萎缩、边缘白纹呈放射状排列", "盘状红斑狼疮直接免疫荧光可见基底膜带免疫球蛋白与补体颗粒/带状沉积（狼疮带试验阳性）", "苔藓样反应多与银汞合金充填体邻近或与药物（如部分降压药、抗疟药、降糖药）相关，去除诱因后可好转", "白斑为不能被擦去的白色斑块（分均质型与非均质型），病理可伴上皮异常增生", "类天疱疮病理为上皮下疱，Nikolsky征可阳性，牙龈好发", "扁平苔藓皮肤损害直接免疫荧光可见棘细胞间鱼网状IgG沉积"], "ans": "ABCDE", "exp": "F错：棘细胞间鱼网状IgG沉积是天疱疮的免疫荧光特征，扁平苔藓无此表现。A-E均为扁平苔藓与DLE、苔藓样反应、白斑、类天疱疮鉴别的核心要点，其中“与充填体/药物的时空关系”是识别苔藓样反应的关键。"}, {"tag": "恶变与监测·多选", "stem": "关于扁平苔藓的恶变潜能与随访，正确的有：", "opts": ["属口腔潜在恶性疾患（癌前状态），长期糜烂型、萎缩型恶变风险相对较高", "长期不愈的糜烂、溃疡，尤其位于舌缘、牙龈者应提高警惕", "病损出现基底变硬、结节状增生或经久不愈的溃疡时应及时活检", "一旦确诊即属癌前病变，应一律手术切除全部白色条纹", "建议每3～12个月复查，糜烂不愈者缩短随访间隔", "吸烟、饮酒等不良习惯叠加可增加恶变风险，应劝其戒除"], "ans": "ABCEF", "exp": "D错：扁平苔藓恶变率低（一般报道约0.4%～2%），网状型更属良性过程，过度治疗无依据；正确策略是控制症状、定期监测、可疑变化时活检，而非一律手术。A、B、C、E、F均为规范的监测原则。"}, {"tag": "治疗·多选", "stem": "本例的治疗方案，正确的有：", "opts": ["无症状的网状型可不予药物，仅心理疏导、去除刺激并定期复查", "糜烂型首选局部糖皮质激素（如曲安奈德口腔糊剂、地塞米松含漱液）", "顽固不愈病例可局部应用他克莫司等钙调神经磷酸酶抑制剂", "调磨锐利牙尖、更换邻近的银汞合金充填体以排除苔藓样反应因素", "所有患者均应长期大剂量全身应用糖皮质激素作为首选", "合并念珠菌感染时应同时行抗真菌治疗（如制霉菌素含漱）"], "ans": "ABCDF", "exp": "E错：全身糖皮质激素仅用于急性广泛糜烂或顽固重症的短期冲击，长期大剂量全身应用副作用大，绝非首选；本病以局部治疗为主。A观察随访适用于无症状网状型；B局部激素为糜烂型一线；C他克莫司为二线选择（注意局部刺激与远期安全性）；D去除局部刺激与可疑材料是重要环节；F激素局部使用易继发念珠菌感染，须警惕并同时处理。"}]}, {"no": "病例一", "subj": "医学人文与卫生法规", "cat": "人文", "diag": "口腔门诊执业规范·知情同意·传染病报告·医疗损害责任", "level": "中难", "time": "6分钟", "stem": [{"k": "形式", "v": "短情境综合题"}, {"k": "背景", "v": "某口腔门诊部日常诊疗与一起医疗纠纷处置中的若干情境，均为不定项选择。"}], "qs": [{"tag": "执业规则·多选", "stem": "下列行为违反现行法律法规的有：", "opts": ["已取得口腔类别《医师执业证书》并注册在本门诊的医师，按注册的执业范围开展牙列缺损种植修复", "口腔执业助理医师未经执业医师指导，独立为患者实施拔牙术", "患者为索赔请托医师开具与事实不符的“牙外伤系他人殴打所致、建议休息30日”证明，医师碍于情面出具", "该门诊核准登记的诊疗科目仅为口腔科，却擅自开展医疗美容科抽脂手术", "遇颌面外伤伴颅脑损伤、超出本机构设备和技术条件的患者，医师未予转诊而坚持自行处置"], "ans": "BCDE", "exp": "解析：医师应按注册的执业地点、类别、范围执业；执业助理医师应在执业医师指导下执业（B违法）。医师不得出具与自己执业范围无关或与事实不符的医学证明文件（C违法）。医疗机构必须按照核准登记的诊疗科目开展诊疗活动（D违法）。限于设备或技术条件不能诊治的患者应及时转诊（E违规）。A为合法执业；另对急危患者采取紧急措施诊治是法定义务，不得拒绝急救处置。"}, {"tag": "急救与紧急同意·单选", "stem": "一交通事故患者颌面部活动性大出血、失血性休克、深度昏迷，无家属陪同且暂时联系不上近亲属，需立即手术止血。正确做法是：", "opts": ["必须等家属赶到签字后方可手术", "经治医师提出医疗处置方案，取得医疗机构负责人或者被授权负责人员的批准后实施", "无签字一律不予处理，直接转上级医院", "请110民警代为签字后手术", "直接手术，无需履行任何批准程序"], "ans": "B", "exp": "解析：《民法典》第1220条及《医疗机构管理条例》第33条：因抢救生命垂危患者等紧急情况，不能取得患者或者其近亲属意见的，经医疗机构负责人或者授权的负责人批准，可以立即实施相应的医疗措施。A、C延误抢救违反急救义务（不得拒绝急救处置）；民警无权代签（D错）；紧急情形免除的是知情同意签字，而非负责人批准这一程序（E错）。"}, {"tag": "知情同意主体·多选", "stem": "关于知情同意，下列正确的有：", "opts": ["意识清醒的成年患者拔牙，应由患者本人签署知情同意书", "15岁儿童行正畸减数拔牙，应由其监护人（父母）签字同意", "患者委托他人代为签字时，代理人应持有患者签署的授权委托书", "患者充分知情后拒绝治疗，医师应记录告知内容并请患者签字确认", "药物临床试验只要医师评估获益大于风险即可开始，无需伦理委员会审查"], "ans": "ABCD", "exp": "解析：知情同意首选患者本人；无/限制民事行为能力人（未成年人等）由法定监护人签字；委托代理人须有授权委托书；患者拒绝治疗应在病历中记录告知风险并请其签字，不得强制治疗。E错：涉及人的生物医学研究和临床试验必须经伦理委员会审查同意，并取得受试者书面知情同意，人体器官捐献移植亦须自愿、无偿并履行法定程序。"}, {"tag": "传染病报告时限·单选", "stem": "门诊接诊一名剧烈米泔水样腹泻伴脱水患者，临床诊断为霍乱（甲类传染病）。责任疫情报告人应于多长时间内进行网络直报：", "opts": ["2小时内", "6小时内", "12小时内", "24小时内", "48小时内"], "ans": "A", "exp": "解析：《传染病防治法》：对甲类传染病以及按甲类管理的乙类传染病（非典、肺炭疽），城镇应于2小时内网络直报；其他乙类、丙类传染病于24小时内报告。干扰项6/12小时为旧版城镇/农村时限口径，已废止；24小时是乙丙类一般时限，用于甲类即为迟报违法。"}, {"tag": "传染病管理与隐私·多选", "stem": "关于传染病防治，下列正确的有：", "opts": ["甲类传染病仅包括鼠疫、霍乱两种", "传染性非典型肺炎、炭疽中的肺炭疽属乙类传染病，但采取甲类传染病的预防、控制措施", "新型冠状病毒感染自2023年1月8日起调整为“乙类乙管”，仍须依法报告但不再采取甲类管控", "艾滋病患者要求保密时，医师可不予疫情报告", "任何单位和个人不得歧视传染病患者，医师在依法报告的同时应保护患者隐私，不得向无关人员泄露"], "ans": "ABCE", "exp": "解析：甲类=鼠疫、霍乱；乙类甲管=非典、肺炭疽；新冠现行为乙类乙管。D错：报告是法定义务，不因患者要求保密而免除——隐私保护与疫情上报并行不悖，瞒报、缓报、谎报均违法；但不得向无关人员泄露患者个人信息。"}, {"tag": "医疗损害责任·多选", "stem": "患者输液后死亡，家属对诊疗提出异议。下列处理与法律规则正确的有：", "opts": ["医疗损害责任以过错责任为一般原则；但医疗机构违反诊疗规范、隐匿或拒绝提供病历、遗失伪造篡改或违法销毁病历资料的，推定其有过错", "医患双方对死因有异议的，应在患者死亡后48小时内进行尸检；具备尸体冻存条件的，可以延长至7日", "疑似输液、输血、注射、用药等引起不良后果的，医患双方应当共同对现场实物（输液器、药液、血液等）进行封存、启封", "患者有权复制体温单、医嘱单、检验报告、医学影像资料、手术及麻醉记录、病理资料、护理记录等病历资料", "纠纷发生后，经治医师可连夜修改完善病程记录，使病历“还原事实真相”"], "ans": "ABCD", "exp": "解析：依据《民法典》第1218、1222条及《医疗纠纷预防和处理条例》：过错责任为原则，三种情形过错推定；尸检48小时、冻存条件下延至7日（拒绝或拖延尸检影响死因判定的，由拒绝拖延方承担责任）；现场实物须医患双方共同封存，需要检验的共同委托；患者有权复制条例列举的病历资料。E错：伪造、篡改病历属违法行为并直接推定过错，是纠纷处理中最常见的致命错误。"}]}, {"no": "病例二", "subj": "医学人文与卫生法规", "cat": "人文", "diag": "特殊药品处方·抗菌药物分级·职业暴露与院感·门诊急救·预防宣教", "level": "中难", "time": "6分钟", "stem": [{"k": "形式", "v": "短情境综合题"}, {"k": "背景", "v": "口腔门诊药事管理、职业暴露处置与椅旁急救、预防宣教情境，均为不定项选择。"}], "qs": [{"tag": "麻精毒处方管理·多选", "stem": "关于麻醉药品、精神药品和医疗用毒性药品处方，下列正确的有：", "opts": ["麻醉药品和第一类精神药品处方权须经培训考核合格后取得，医师不得为自己开具该类药品", "门（急）诊患者麻醉药品、第一类精神药品注射剂每张处方为一次常用量；盐酸哌替啶处方为一次常用量且仅限于医疗机构内使用", "麻醉药品、第一类精神药品处方至少保存3年；第二类精神药品和医疗用毒性药品处方至少保存2年", "医疗用毒性药品每次处方剂量不得超过2日极量", "为减轻癌痛患者往返负担，可将麻醉药品注射剂一次开10支交患者带回家自行注射"], "ans": "ABCD", "exp": "解析：《处方管理办法》：麻、精一需专门处方资格且不得自用；门急诊麻、精一注射剂为一次常用量（其他剂型≤3日，控缓释制剂≤7日）；哌替啶限医疗机构内使用；处方保存年限：麻/精一3年、精二/毒性2年、普通1年；毒性药品每次处方不超过2日极量。E错：注射剂一次常用量且不得带离机构使用，是常见陷阱。"}, {"tag": "抗菌药物分级·单选", "stem": "关于抗菌药物临床应用分级管理，下列正确的是：", "opts": ["特殊使用级抗菌药物可由主治医师在口腔门诊开具使用", "限制使用级抗菌药物应由具有主治医师以上专业技术职务任职资格的医师开具", "非限制使用级抗菌药物任何医务人员包括护士均可使用", "特殊使用级抗菌药物可用于门诊输液患者", "普通上呼吸道感染应常规使用抗菌药物预防继发细菌感染"], "ans": "B", "exp": "解析：抗菌药物分三级：非限制使用级（具处方权医师即可）、限制使用级（主治以上）、特殊使用级（高级专业技术职务任职资格医师，且不得在门诊使用、须经会诊同意）。A、D错：特殊使用级严禁门诊使用；C错：处方权属于医师；E错：病毒性上感一般不需抗菌药物，滥用属无指征用药。"}, {"tag": "职业暴露处置·多选", "stem": "洁治操作中，医师被HIV阳性患者使用过的刮治器刺伤出血。下列处置正确的有：", "opts": ["立即从近心端向远心端轻柔挤压伤口周围，尽可能挤出损伤处血液，再用肥皂液和流动水冲洗，75%乙醇或0.5%碘伏消毒伤口", "立即用力挤压伤口并用嘴吸吮伤口以排出污染血液", "HIV暴露后预防用药越早越好，最好在2小时内（一般不应超过72小时），连续服用28天", "报告科室及感控部门，登记并进行暴露级别评估，做基线及定期随访检测", "预防用药服用7天即可停药"], "ans": "ACD", "exp": "解析：针刺伤局部处理=挤（近心端向远心端轻挤）—冲（流动水/皂液，黏膜暴露用大量生理盐水）—消（75%乙醇或0.5%碘伏）—报（感控部门评估登记）—防（评估后预防用药）。HIV暴露后预防用药黄金窗为2小时内、最迟不超过72小时，疗程28天。B错：禁止用力挤压和口吸；E错：7天疗程不足，必须28天。"}, {"tag": "消毒灭菌与医疗废物·多选", "stem": "关于口腔器械消毒灭菌与医疗废物分类，下列正确的有：", "opts": ["拔牙钳、根管治疗器械、车针等接触血液、破损黏膜或进入无菌组织的属高度危险器械，必须一人一用一灭菌", "牙科手机应一人一用，每次使用后清洗并消毒/灭菌（首选压力蒸汽灭菌）", "使用后的注射针头应立即双手回套针帽，再投入黑色生活垃圾袋", "被患者血液污染的棉球、敷料属感染性废物，置黄色专用包装袋；针头、刀片等置利器盒按损伤性废物处理", "听诊器、血压计袖带等仅接触完整皮肤的低度危险物品也必须高压蒸汽灭菌"], "ans": "ABD", "exp": "解析：按斯波尔丁（Spaulding）分类：高危器械（进入无菌组织/接触血液破损黏膜）必须灭菌；中危器械（接触完整黏膜，如手机、口镜）至少中高水平消毒、手机提倡一人一用一灭菌；低危物品（接触完整皮肤）清洁或低中水平消毒即可，E错。C错：严禁双手回套针帽（针刺伤主因），锐器直接入利器盒。医疗废物分五类：感染性（黄袋）、损伤性（利器盒）、病理性、药物性、化学性。"}, {"tag": "门诊急救·多选", "stem": "关于口腔门诊常见急症处置，下列正确的有：", "opts": ["血管抑制性晕厥是口腔门诊最常见急症，处理：立即停止操作、放平椅位取头低位、松解衣领、保持呼吸道通畅，多数患者可迅速自行恢复", "局麻药中毒早期表现为口周麻木、耳鸣、金属味、兴奋多语，重者抽搐惊厥；处理：立即停药、吸氧、保持气道通畅，必要时抗惊厥及生命支持", "过敏性休克首选肾上腺素1:1000于大腿前外侧肌内注射（成人0.3~0.5mg），同时呼救、平卧、吸氧、建立静脉通道", "过敏性休克应首选静脉推注地塞米松", "成人心肺复苏：按压胸骨下半部（两乳头连线中点），频率100~120次/分，深度5~6cm，按压与人工通气比30:2"], "ans": "ABCE", "exp": "解析：晕厥处理核心是头低位改善脑灌注；局麻药中毒源于相对过量或误入血管，以停药、气道、氧疗、抗惊厥为原则；肾上腺素是过敏性休克唯一首选一线药物，肌注（大腿外侧）起效最快，糖皮质激素起效慢仅为辅助，D错；CPR参数100~120次/分、5~6cm、30:2须牢记。意识不清者严禁喂水喂食（误吸窒息）。"}, {"tag": "预防宣教·多选", "stem": "关于口腔预防保健宣教，下列正确的有：", "opts": ["含氟牙膏是有效防龋措施：3岁以下用量约米粒大小，3~6岁约豌豆大小并防止吞咽", "窝沟封闭适宜年龄：乳磨牙3~4岁，第一恒磨牙6~7岁，第二恒磨牙11~13岁", "巴氏（Bass）刷牙法：刷毛与牙面呈45°角指向龈沟，短距离水平颤动拂刷，每日至少2次、每次不少于2~3分钟", "妊娠4~6个月为口腔治疗相对安全期，孕前应完成口腔检查；第一颗乳牙萌出后6个月内（不迟于1岁）应进行首次口腔检查", "为增强防龋效果，儿童应每日使用高浓度含氟漱口水并吞咽"], "ans": "ABCD", "exp": "解析：含氟牙膏用量分龄是高频考点；窝沟封闭时机为牙萌出后窝沟深而未龋时，三年龄段须记准；Bass法45°角水平颤动是标准表述；孕中期（4~6月）是相对安全治疗窗，孕早期（前3月）和孕晚期避免非急症处理。E错：低龄儿童不宜用含氟漱口水，更严禁吞咽，可致氟斑牙甚至急性氟中毒。"}]}]}, {"name": "高难补充3·真题高频（14题）", "cases": [{"no": "病例一", "subj": "牙体牙髓病学", "cat": "口内", "diag": "深龋与可复性牙髓炎鉴别＋牙隐裂/着色牙", "level": "难", "time": "6分钟", "stem": [{"k": "形式", "v": "短情境综合，补真题高频（龋病治疗、非龋性硬组织病）。"}], "qs": [{"tag": "深龋护髓·多选", "stem": "深龋近髓、去腐后近髓处极敏感但无自发痛，正确处理有：", "opts": ["鉴别可复性牙髓炎：冷测一过性敏感、刺激去除痛即消失", "近髓处保留少量软化牙本质行间接盖髓（如氢氧化钙/生物陶瓷），二次去腐", "用氧化锌丁香油粘固粉安抚观察", "一旦近髓即行根管治疗", "玻璃离子垫底护髓后行复合树脂永久充填（夹层修复）", "深龋洞直接用磷酸锌粘固粉深垫底、不护髓"], "ans": "ABCE", "exp": "D过度治疗：无可复性牙髓炎以外的牙髓炎症证据时应尽量保髓；F错：磷酸锌直接接触近髓牙本质可刺激牙髓、释放游离酸，近髓需护髓/垫底。"}, {"tag": "牙隐裂·多选", "stem": "后牙咬合到某一特定点剧痛、冷热敏感，怀疑牙隐裂，正确的是：", "opts": ["好发于上颌磨牙、常有高耸牙尖或深窝沟", "特征为特定位置咬合痛（咬合试验阳性），可伴冷刺激敏感", "可用碘酊/龙胆紫染色或灯光透照帮助显示裂纹", "未穿髓、无症状者可调磨高陡牙尖、全冠保护", "隐裂已达髓腔或有牙髓炎症状者按牙髓治疗后冠修复", "凡隐裂一律拔除"], "ans": "ABCDE", "exp": "F错：隐裂牙多数可经护髓/根管+全冠保留，纵裂至根、预后差者才考虑拔除。"}, {"tag": "着色牙鉴别·多选", "stem": "关于氟牙症与四环素牙，正确的是：", "opts": ["氟牙症有高氟地区生活史，主要见于恒牙、呈对称性白垩/斑块，耐磨性下降但抗酸", "四环素牙为牙发育矿化期服药所致、恒牙乳牙均可、可呈弥漫黄褐甚至条带", "氟牙症斑块表面釉质发育基本完整，外源性着色可用漂白/微打磨/贴面改善", "四环素牙变色在牙本质，重者单纯漂白效果有限，可贴面/全冠", "预防关键：7岁前避免高氟摄入；孕期及8岁前避免使用四环素", "氟牙症患牙一律做根管内漂白"], "ans": "ABCDE", "exp": "F错：氟牙症为釉质表层/发育问题，多采用外漂白、微打磨或贴面，不做无指征的根管及髓腔内漂白。"}]}, {"no": "病例二", "subj": "牙周病学", "cat": "牙周", "diag": "慢性牙周炎分度·牙周脓肿·坏死性溃疡性龈炎", "level": "难", "time": "6分钟", "stem": [{"k": "形式", "v": "短情境综合，补龈炎/牙周炎鉴别与高频急症。"}], "qs": [{"tag": "龈炎与牙周炎·多选", "stem": "区别慢性龈炎与牙周炎、判断严重程度，正确的是：", "opts": ["有无牙周附着丧失和牙槽骨吸收是龈炎与牙周炎的根本区别", "旧分类按附着丧失分轻度1–2mm、中度3–4mm、重度≥5mm；骨吸收<根长1/3、1/3–1/2、>1/2", "牙周探诊深度增加不一定等于附着丧失（可有牙龈肿胀增生性假性牙周袋）", "慢性龈炎无附着丧失、无骨吸收，治愈后牙周组织可完全恢复正常", "牙周炎造成的附着丧失一般不可逆", "探诊出血只在重度牙周炎才出现"], "ans": "ABCDE", "exp": "F错：探诊出血（BOP）在牙龈炎早期即可出现，是炎症的敏感指标，并非重度牙周炎才有。"}, {"tag": "牙周脓肿·多选", "stem": "牙周袋深、突发搏动性痛、牙龈半球形隆起、叩痛松度增加，关于牙周脓肿：", "opts": ["脓肿部位近龈缘、常可探及深牙周袋，牙髓活力多正常", "与根尖周脓肿鉴别要点：后者多有牙体疾患、牙髓无活力、肿痛中心近根尖", "急性期止痛、引流（袋内引流或切开）、必要时调合、全身抗生素", "急性期即行彻底龈下刮治并大量冲洗可替代引流", "反复发作与深牙周袋/根分叉病变/龈下结石有关，炎症控制后行系统牙周治疗", "牙髓活力正常即可排除根尖来源，不需拍片"], "ans": "ABCE", "exp": "D错：急性期以引流为主，粗暴深刮加重创伤；F错：仍需X线评估骨破坏并排除牙周-牙髓联合病变。"}, {"tag": "NUG·多选", "stem": "急性坏死性溃疡性龈炎（NUG）的特点与处理：", "opts": ["龈乳头和龈缘坏死、火山口样缺损，灰白色假膜，擦去后出血、剧痛", "特征性腐败性口臭、明显自发性出血", "致病菌为梭杆菌、螺旋体等（Vincent感染），与精神压力、吸烟、免疫低下相关", "处理：轻柔去净坏死物、1%–3%过氧化氢冲洗/含漱，必要时全身甲硝唑，支持治疗", "急性期即行牙龈切除术成形", "属传染病，须按甲类上报"], "ans": "ABCD", "exp": "E错：急性期先控制感染炎症，牙龈外形改建在愈合后必要时再做；F错：NUG不是法定甲类传染病。"}]}, {"no": "病例三", "subj": "口腔黏膜病学", "cat": "黏膜", "diag": "阿弗他·疱疹·念珠菌·舌疾病 鉴别", "level": "难", "time": "7分钟", "stem": [{"k": "形式", "v": "短情境综合，补黏膜最高频考点。"}], "qs": [{"tag": "RAU与疱疹·多选", "stem": "复发性阿弗他溃疡与原发性疱疹性口炎鉴别，正确的是：", "opts": ["RAU好发于非角化黏膜（唇、颊、舌腹、软腭），表现为'黄红凹痛'、不聚集成簇、不成疱", "疱疹性口炎好发于6岁以下儿童、成簇小水疱破溃、可发生于角化黏膜（硬腭、牙龈）", "腺周口疮（重型RAU）溃疡大而深、愈后可留瘢痕，需与癌性、结核性溃疡鉴别", "RAU伴生殖器溃疡、眼炎、皮肤结节红斑等应警惕白塞病", "疱疹性口炎病原为单纯疱疹病毒，可有发热等全身症状与角化黏膜受累", "凡口腔多发小溃疡都是念珠菌感染"], "ans": "ABCDE", "exp": "F错：念珠菌病典型为可擦去的白色假膜（擦去后红湿基底），与溃疡/疱疹表现不同。"}, {"tag": "念珠菌病·多选", "stem": "关于口腔念珠菌病：", "opts": ["急性假膜型（雪口）婴幼儿多见，白色凝乳状假膜可擦去、其下红", "急性红斑型常见于长期用广谱抗生素/激素后，黏膜弥散发红、灼痛", "慢性红斑型即义齿性口炎，好发承托区黏膜，与义齿不洁、夜间戴用有关", "确诊可取假膜涂片见菌丝孢子或真菌培养", "治疗去除诱因（清洁/浸泡义齿、停不必要抗生素）＋局部抗真菌（制霉菌素/碳酸氢钠含漱）", "白斑可擦去，念珠菌假膜不能擦去"], "ans": "ABCDE", "exp": "F说反了：念珠菌假膜通常可擦去，白斑不能被擦去。"}, {"tag": "舌部疾病·多选", "stem": "常见舌黏膜病，正确的是：", "opts": ["地图舌（良性游走性舌炎）为丝状乳头剥脱红斑、周边黄白边、位置游走，多无症状", "沟纹舌表现舌背多条深沟，注意清洁防食物滞留炎症，常与地图舌并存", "毛舌为丝状乳头过度角化伸长、可着色（黑毛舌），与卫生、吸烟、抗生素相关", "萎缩性舌炎乳头萎缩、舌面光滑发红，可见于贫血（缺铁/巨幼贫）、烟酸缺乏等", "菱形舌（正中菱形舌炎）位于舌背正中人字沟前方，现认为与念珠菌相关", "舌痛有溃疡硬结超过2周不愈一律按良性处理、无需活检"], "ans": "ABCDE", "exp": "正中菱形舌现多认为与念珠菌慢性感染相关（E正确）；F错：超过2周不愈的溃疡/硬结需活检排除恶性。"}, {"tag": const LS_W="jz_wrongs_v1", LS_P="jz_progress_v1";

const LETTERS="ABCDEFGH";
const store={
 get(k,d){try{const x=localStorage.getItem(k);return x==null?d:JSON.parse(x)}catch(e){return d}},
 set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
function flatten(si){const items=[];DATA[si].cases.forEach((c,ci)=>c.qs.forEach((q,qi)=>items.push({si,ci,qi,q,c})));return items;}
function keyOf(it){return it.si+"-"+it.ci+"-"+it.qi;}
function scoreQ(q,picked){const A=q.ans.split("");let gain=0;A.forEach(L=>gain+=picked.includes(L)?1:0);picked.forEach(L=>{if(!A.includes(L))gain-=1});return {gain:Math.max(0,gain),max:A.length};}
function caseBlock(c,open){
 const rows=c.stem.map(s=>`<div class="row"><b>${s.k}：</b>${s.v}</div>`).join("");
 if(open) return `<div class="case"><div class="ct">${c.no}（${c.subj}）</div>${rows}</div>`;
 return `<details class="case"><summary>${c.no}（${c.subj}）· 点此展开病例资料</summary>${rows}</details>`;
}

function subjMatch(key,c){
 const t=(c.cat+" "+c.subj);
 if(key==="kounei")return /牙体|牙髓|口内/.test(t);
 if(key==="yazhou")return /牙周/.test(t);
 if(key==="nianmo")return /黏膜/.test(t);
 if(key==="kouwai")return /外科|口外|儿童|儿牙/.test(t);
 if(key==="kouxiu")return /修复/.test(t);
 if(key==="renwen")return /人文|法规|伦理|医患/.test(t);
 if(key==="gankong")return /感控|院感|感染控制|预防|用药|药理/.test(t);
 return false;
}
function flattenSubject(key){
 const items=[];
 DATA.forEach((set,si)=>set.cases.forEach((c,ci)=>{
   if(subjMatch(key,c))c.qs.forEach((q,qi)=>items.push({si,ci,qi,q,c}));
 }));
 return items;
}
function startSubject(key){
 const items=flattenSubject(key);
 if(!items.length){alert("该科目暂无题目");viewSubjects();return;}
 const st=loadStudyState("jz_subj_"+key,items.length);
 const name=(SUBJECTS.find(s=>s.key===key)||{}).name||key;
 study={scope:"subj",si:-1,subjKey:key,subjName:name,items,idx:0,picked:st.picked,revealed:st.revealed,navOpen:false,mapFilter:"all"};

function viewStudyMap(){
 const N=study.items.length;let done=0,rev=0;
 for(let i=0;i<N;i++){if(study.revealed[i]){rev++;if(qStatus(i)===1)done++;}}

 // 跨套按 真实(si,ci) 分组

 study.items.forEach((x,i)=>{
   const g=groups[groups.length-1];

   else g.idxs.push(i);
 });
 const flt=(key,label,count)=>`<button class="filterchip ${f===key?"on":""}" onclick="setMapFilter('${key}')">${label}${count!=null?" "+count:""}</button>`;
 let html=header("题目地图 · "+title,"",back)

      </div>

    </div>`;
 groups.forEach(g=>{

 });
 if(f!=="all"&&!groups.some(g=>g.idxs.some(vis)))html+=`<div class="card empty">这一类暂时没有题 🎉</div>`;

function qStatus(i){
 if(!study.revealed[i])return 0;                 // 未做
 const r=scoreQ(study.items[i].q,study.picked[i]||[]);
 return r.gain===r.max?1:2;                      // 1已掌握 2需复习
}
function toggleOpt(L){
 const cur=study.picked[study.idx]?study.picked[study.idx].slice():[];
 const i=cur.indexOf(L);
 if(i>=0)cur.splice(i,1);else cur.push(L);
 study.picked[study.idx]=cur;saveStudyState();
 renderStudy();
}
function reveal(){
 study.revealed[study.idx]=true;
 const it=study.items[study.idx],picked=study.picked[study.idx]||[];
 const r=scoreQ(it.q,picked);
 // 错题本：非满分即收录；满分则移出
 let w=store.get(LS_W,[]);
 const id=keyOf(it);
 if(r.gain<r.max){if(!w.includes(id))w.push(id);}else{w=w.filter(x=>x!==id);}
 store.set(LS_W,w);

 renderStudy();
}
function gotoQ(i){study.idx=i;saveStudyState();renderStudy();}

 const opts=q.opts.map((o,i)=>{const L=LETTERS[i];let cls="opt";
   if(rev){if(A.includes(L))cls+=" correct";else if(picked.includes(L))cls+=" wrong";else cls+=" dim";}
   else if(picked.includes(L))cls+=" sel";
   const click=rev?"":`onclick="toggleOpt('${L}')"`;
   return `<div class="${cls}" ${click}><div class="L">${L}</div><div class="X">${o}</div></div>`;}).join("");
 let verdict="";
 if(rev){const r=scoreQ(q,picked);
   const cls=r.gain===r.max?"v-ok":(r.gain>0?"v-part":"v-bad");

 }
 const isLast=study.idx===study.items.length-1;
 const N=study.items.length;
 let done=0,revN=0;for(let i=0;i<N;i++){if(study.revealed[i]){revN++;if(qStatus(i)===1)done++;}}
 const cells=study.items.map((x,i)=>{const st=qStatus(i);
   const cls="ncell "+(st===1?"done":st===2?"review":"")+(i===study.idx?" cur":"");
   const mark=st===1?"✓":st===2?"↻":(i+1);
   return `<button class="${cls}" onclick="gotoQ(${i})" title="第${i+1}题">${mark}</button>`;}).join("");
 const navExtra=`<button class="hdnav" onclick="toggleStudyNav()" id="navBtn">题号 ▾</button>`;
 let navCard="";
 if(study.navOpen){
   const groups=[];
   study.items.forEach((x,i)=>{if(i===0||study.items[i-1].ci!==x.ci)groups.push({ci:x.ci,subj:x.c.subj,diag:x.c.diag,start:i});});
   navCard=`<div class="card" id="navCard">
     <div style="display:flex;justify-content:space-between;align-items:center">
       <b style="font-size:15px">选题号 · 直接跳做</b>
       <span style="font-size:12.5px;color:var(--sub)">已掌握 ${done} / 做过 ${revN} / 共 ${N}</span></div>
     <div class="navlegend"><span><i class="ld"></i>已掌握</span><span><i class="lr"></i>需复习</span><span><i class="ln"></i>未做</span></div>
     <div class="navgrid">${cells}</div>
     <div class="casejump">${groups.map(g=>`<button onclick="gotoQ(${g.start})">${g.subj.replace('病学','').replace('口腔','')}·${g.diag.length>9?g.diag.slice(0,9)+'…':g.diag}</button>`).join("")}</div>
   </div>`;
 }
 $app.innerHTML=header(`背题 (${study.idx+1}/${N})`,navExtra,"map")
  +navCard
  +caseBlock(it.c,firstInCase)
  +`<div class="card">
      <span class="qtag">${q.tag}</span>
      <p class="qstem">${q.stem}</p>
      ${opts}${verdict}
      <div class="footspace"></div>
      ${rev?`<button class="btn ${isLast?"btn-ok":"btn-pri"}" onclick="nextQ()">${isLast?"完成本套，看小结":"下一题 ›"}</button>`
            :`<button class="btn btn-pri" ${picked.length?"":"disabled"} onclick="reveal()">确认答案</button>`}
      <div class="qnavrow">
        ${study.idx>0?`<button onclick="prevQ()">‹ 上一题</button>`:"<span></span>"}
        <button class="mapbtn" onclick="viewStudyMap()">📋 题目地图</button>
        ${!isLast?`<button onclick="gotoQ(${study.idx+1})">${rev?"下一题":"跳过"} ›</button>`:"<span></span>"}
      </div>
    </div>`;
 window.scrollTo(0,0);
}

   const picked=exam.picks[k]||[];
   html+=`<div class="card"><span class="qtag">${it.q.tag}</span><p class="qstem">${i+1}. ${it.q.stem}</p>`+

    `</div>`;
 });
 const answered=Object.keys(exam.picks).filter(k=>(exam.picks[k]||[]).length).length;
 html+=`<div style="position:sticky;bottom:0;background:linear-gradient(transparent,#eef3f5 30%);padding:10px 0 calc(10px + env(safe-area-inset-bottom))">

function askSubmit(){const unanswered=exam.items.filter((_,i)=>!(exam.picks[i]||[]).length).length;
 if(unanswered>0){if(!confirm(`还有 ${unanswered} 题未作答，确定交卷吗？`))return;}

function quitExam(){if(confirm("退出本次模拟考？作答不会保留。")){clearInterval(timerH);exam=null;viewHome();}}
function submitExam(auto){
 clearInterval(timerH);exam.submitted=true;
 const used=30*60-exam.left;
 let gain=0,max=0,wrong=0;const perCase={};
 const w=store.get(LS_W,[]);let wset=new Set(w);
 exam.items.forEach((it,i)=>{const p=exam.picks[i]||[];const r=scoreQ(it.q,p);gain+=r.gain;max+=r.max;
   perCase[it.ci]=(perCase[it.ci]||{g:0,m:0,name:it.c.no,cat:it.c.cat});perCase[it.ci].g+=r.gain;perCase[it.ci].m+=r.max;
   if(r.gain<r.max){wrong++;wset.add(keyOf(it));}else{wset.delete(keyOf(it));}});
 store.set(LS_W,[...wset]);
 const score=Math.round(gain/max*100);
 let html=header(`模拟考结果 · 第${exam.si+1}套`)
 +`<div class="card scorehero"><div class="num">${score}</div><div class="lb">总分（百分制）　用时 ${fmt(used)}${auto?"（时间到自动交卷）":""}</div>
   <div class="statgrid"><div class="stat"><div class="n">${gain}/${max}</div><div class="t">选项得分</div></div>

   <div class="stat"><div class="n">${wrong}</div><div class="t">有错/漏选</div></div></div></div>`;
 html+=`<div class="card"><div class="qstem" style="font-size:15px">分病例得分</div>`+
  Object.values(perCase).map(p=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between;font-size:13.5px"><span>${p.name} · ${p.cat}</span><b>${p.g}/${p.m}</b></div><div class="bar"><i style="width:${Math.round(p.g/p.m*100)}%"></i></div></div>`).join("")+`</div>`;
 // 逐题回顾
 let lastCi=-1;
 html+=`<div class="card"><div class="qstem" style="font-size:15px">逐题解析</div>`;
 exam.items.forEach((it,i)=>{const q=it.q,p=exam.picks[i]||[],r=scoreQ(q,p),A=q.ans.split("");
   if(it.ci!==lastCi){html+=`<div style="margin-top:10px;font-weight:700;color:var(--blue)">${it.c.no}（${it.c.subj}）</div>`;lastCi=it.ci;}
   html+=`<div class="qblock"><div class="review-head"><span class="pill cat">${q.tag}</span>
     <span class="pill ${r.gain===r.max?"right":"miss"}">${r.gain===r.max?"正确":r.gain+"/"+r.max}</span></div>
     <div style="font-weight:600;font-size:14.5px;margin-bottom:6px">${i+1}. ${q.stem}</div>`+
     q.opts.map((o,j)=>{const L=LETTERS[j];let cls="opt dim";if(A.includes(L))cls="opt correct";else if(p.includes(L))cls="opt wrong";
       return `<div class="${cls}"><div class="L">${L}</div><div class="X">${o}</div></div>`;}).join("")+
     `<div class="exp"><b>答案 ${q.ans}｜</b>${q.exp}</div></div>`;
 });
 html+=`</div><button class="btn btn-pri" onclick="viewHome()">返回首页</button>
        <div style="height:10px"></div><button class="btn btn-ghost" onclick="startExam(${exam.si})">再考一次本套</button>`;
 $app.innerHTML=html;window.scrollTo(0,0);
}

/* ---------------- 错题本 ---------------- */
function findByKey(k){const [si,ci,qi]=k.split("-").map(Number);const it=flatten(si).find(x=>x.ci===ci&&x.qi===qi);return it;}
let wrongMode={i:0,rev:{}};
function viewWrong(){
 const keys=store.get(LS_W,[]);const items=keys.map(findByKey).filter(Boolean);
 if(!items.length){$app.innerHTML=header("错题本")+`<div class="card empty">还没有错题 🎉<br>背题或模拟考中没拿满分的题会自动收进来</div><button class="btn btn-pri" onclick="viewHome()">返回首页</button>`;return;}
 wrongMode={items,i:0,rev:{},picked:{}};renderWrong();
}
function wToggle(L){const cur=wrongMode.picked[wrongMode.i]||[];const x=cur.indexOf(L);if(x>=0)cur.splice(x,1);else cur.push(L);wrongMode.picked[wrongMode.i]=cur;renderWrong();}
function wReveal(){wrongMode.rev[wrongMode.i]=true;renderWrong();}
function wNext(){
 // 当前题若已做对，则从错题本移除（下一题顶到同一索引）；否则前进
 const it=wrongMode.items[wrongMode.i];
 const picked=wrongMode.picked[wrongMode.i]||[];
 const full=it&&scoreQ(it.q,picked).gain===scoreQ(it.q,picked).max;
 if(full){const ws=store.get(LS_W,[]).filter(x=>x!==keyOf(it));store.set(LS_W,ws);wrongMode.items.splice(wrongMode.i,1);wrongMode.rev={};}
 else{wrongMode.i++;}
 if(wrongMode.i>=wrongMode.items.length){if(wrongMode.items.length===0)viewHome();else{wrongMode.i=wrongMode.items.length-1;viewHome();}return;}
 renderWrong();window.scrollTo(0,0);
}
function renderWrong(){
 const it=wrongMode.items[wrongMode.i],q=it.q,picked=wrongMode.picked[wrongMode.i]||[],rev=wrongMode.rev[wrongMode.i],A=q.ans.split("");
 const opts=q.opts.map((o,j)=>{const L=LETTERS[j];let cls="opt";if(rev){if(A.includes(L))cls+=" correct";else if(picked.includes(L))cls+=" wrong";else cls+=" dim";}else if(picked.includes(L))cls+=" sel";
  return `<div class="${cls}" ${rev?"":`onclick="wToggle('${L}')"`}><div class="L">${L}</div><div class="X">${o}</div></div>`;}).join("");
 let verdict="";if(rev){const r=scoreQ(q,picked);
  verdict=`<div class="verdict ${r.gain===r.max?"v-ok":(r.gain?"v-part":"v-bad")}">得分 ${r.gain}/${r.max}　答案 ${q.ans}</div><div class="exp"><b>解析：</b>${q.exp}</div>`;
 }
 $app.innerHTML=header(`错题本 (${wrongMode.i+1}/${wrongMode.items.length})`,"","home")
 +`<div class="card wrong-item"><div class="muted" style="margin-bottom:6px">第${it.si+1}套 · ${it.c.subj}</div>`
 +caseBlock(it.c,false)
 +`<span class="qtag">${q.tag}</span><p class="qstem">${q.stem}</p>${opts}${verdict}<div class="footspace"></div>`
 +(rev?`<button class="btn btn-pri" onclick="wNext()">${wrongMode.i<wrongMode.items.length-1?"下一题 ›":"做完，返回"}</button>`
      :`<button class="btn btn-pri" ${picked.length?"":"disabled"} onclick="wReveal()">确认答案</button>`)
 +`</div>`;
 window.scrollTo(0,0);
}

  <div class="fpg" id="fhum">
   <div class="note" style="margin:0 0 12px">规程依据：P4知识要求③"医疗法律法规、医患沟通、临床伦理"；P5"沟通与宣教"；模块四"其他"20题（感控/预防宣教/用药安全）；模块五泽众平台含"<b>模拟医患沟通</b>"环节＋综合评价10%。</div>

   <details class="hblk" open><summary>① 沟通接诊（模块五最高频）</summary><div class="hin">
     <p>· 开场用<b>开放式提问</b>（"您哪不舒服？"），不打断、不诱导、不先入为主。</p>
     <p>· 解释病情用患者听得懂的话，避免术语；先安抚情绪再谈方案。</p>
     <p>· 患者发火/投诉：先<b>倾听—共情—安抚</b>，不争辩、不推诿、不顶撞。</p>
     <p>· 尊重隐私，关门/拉帘、回避无关人员，不在公共场合讨论病情。</p>
   </div></details>

   <details class="hblk"><summary>② 知情同意 / 拒绝治疗</summary><div class="hin">
     <p>· 治疗前必做<b>知情同意</b>：告知病情、方案、风险、替代方案、费用、预后，并签字。</p>
     <p>· <b>紧急抢救例外</b>：昏迷且无法取得家属签字 → 报医疗机构负责人批准后立即抢救，<span class="bad">不得拒救</span>。</p>
     <p>· 患者拒绝治疗：告知后果、尊重其选择、<b>签字记录</b>，不强迫。</p>
     <p>· 患者提不合理要求（拔好牙、无指征治疗）：解释＋<b>拒绝</b>，不迁就。</p>
     <p>· 坏消息/肿瘤：按保护性医疗，先向<b>家属</b>告知。</p>
   </div></details>

   <details class="hblk"><summary>③ 特殊人群（口腔高频）</summary><div class="hin">
     <p>· 未成年人：拔牙/矫治/窝沟封闭须<b>监护人</b>知情同意。</p>
     <p>· 孕妇：择期拍片拔牙；急症从简，<span class="bad">慎用肾上腺素</span>。</p>
     <p>· 高血压/心脏病/甲亢：慎用肾上腺素，拔牙前评估血压与抗凝药。</p>
     <p>· 过敏体质：用麻药/青霉素前<b>先问过敏史</b>。</p>
     <p>· 传染病：保密为原则，但<b>法定传染病必须上报</b>（保密例外）。</p>
     <p>· 儿童牙科焦虑：tell-show-do、行为引导，不强迫、不恐吓。</p>
   </div></details>

   <details class="hblk"><summary>④ 伦理四原则 + 医患关系型</summary><div class="hin">
     <p>· 四原则：<b>自主</b>（知情同意＋保密）、<b>不伤害</b>、<b>有利</b>（代价最小、效果最好）、<b>公正</b>。</p>
     <p>· 主动-被动型：昏迷、婴幼儿、全麻。</p>
     <p>· <b>指导-合作型：急性期、最常见</b>（牙科多属此型）。</p>
     <p>· 共同参与型：慢性病、长期复诊（牙周/正畸）。</p>
     <p>· 教学观摩、病例发表：先经患者同意、匿名处理。</p>
   </div></details>

   <details class="hblk"><summary>⑤ 法规红线</summary><div class="hin">
     <p>· 甲类传染病＝鼠疫、霍乱，发现立即上报。</p>
     <p>· 不得出具<b>虚假证明</b>、不得超范围行医、不得使用伪劣器械药品。</p>
     <p>· 病历真实完整及时；患者有权复印病历、知情同意书等。</p>
     <p>· 医疗事故争议：先抢救减损害→及时上报→封存病历实物→依法处理。</p>
   </div></details>

   <details class="hblk"><summary>⑥ 感控 / 急救 / 用药安全</summary><div class="hin">
     <p>· 针刺伤：近心端挤血→流水冲洗→消毒→<b>上报</b>→评估 HBV/HCV/HIV。</p>
     <p>· 局麻药中毒：早期兴奋烦躁抽搐→停注、平卧、给氧、止痉、急救。</p>
     <p>· 晕厥：停操作、放平椅位、松解衣领、监测生命体征。</p>
     <p>· 一人一用一灭菌/消毒；手机、车针灭菌，台面器械分区。</p>
     <p>· 过敏休克：立即停药、肾上腺素、给氧、补液、呼救。</p>
   </div></details>

   <details class="hblk"><summary>⑦ 预防宣教（模块四20题常客）</summary><div class="hin">
     <p>· 巴氏刷牙法、每天用牙线、每半年口腔检查。</p>
     <p>· 含氟牙膏防龋；<b>窝沟封闭最佳时机：6–8岁第一恒磨牙</b>。</p>
     <p>· 孕妇/婴幼儿口腔保健、戒含糖奶瓶睡前进食。</p>
     <p>· 牙周维护期定期复查、戒烟宣教。</p>
   </div></details>

   <div class="sec" style="margin-top:12px">
     <h3>🚫 看到这些字眼，选项基本是错的</h3>
     <ul class="tight">
      <li class="bad">"保证根治""绝对安全""肯定没风险""百分之百成功"</li>
      <li class="bad">"不用告诉患者/不用签字""你听我的就行"</li>
      <li class="bad">当众议论病情、泄露患者隐私与信息</li>
      <li class="bad">无指征治疗、迁就患者拔好牙、隐瞒手术风险</li>
      <li class="bad">危急情况下"等家属到了再说"、拒绝抢救</li>
     </ul>
   </div>
  </div>

 </div>`;
