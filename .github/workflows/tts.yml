name: Generate TTS audio

on:
  push:
    paths:
      - "audio/scripts/**"
      - ".github/workflows/tts.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tts-audio
  cancel-in-progress: true

jobs:
  tts:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install edge-tts
        run: pip install --quiet edge-tts

      - name: Generate 普通话(晓晓) + 台湾腔(曉臻)
        shell: bash
        run: |
          set -u
          ok=0; fail=0
          for f in audio/scripts/track*.txt; do
            n=$(basename "$f" .txt); n=${n#track}
            sed -E 's/\[\[slnc [0-9]+\]\]//g' "$f" > "/tmp/${n}.txt"
            for pair in "zh-CN-XiaoxiaoNeural cn" "zh-TW-HsiaoChenNeural tw"; do
              set -- $pair
              voice="$1"; suf="$2"
              got=0
              for attempt in 1 2 3 4 5 6; do
                rm -f "/tmp/${n}_${suf}.mp3"
                if timeout 180 edge-tts --voice "$voice" --rate=-3% --file "/tmp/${n}.txt" --write-media "/tmp/${n}_${suf}.mp3" >/dev/null 2>&1 \
                   && [ -s "/tmp/${n}_${suf}.mp3" ]; then
                  got=1; break
                fi
                echo "retry track ${n} ${suf} attempt ${attempt}"
                sleep 10
              done
              if [ "$got" = "1" ]; then
                ffmpeg -y -loglevel error -i "/tmp/${n}_${suf}.mp3" -c:a aac -b:a 64k "audio/t${n}_${suf}.m4a"
                ok=$((ok+1))
              else
                echo "FAILED track ${n} ${suf}"
                fail=$((fail+1))
              fi
            done
          done
          echo "generated ok=${ok} fail=${fail}"
          [ "$fail" -eq 0 ]

      - name: Commit audio
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add audio/*.m4a
          if git diff --cached --quiet; then
            echo "no audio changes"
          else
            git commit -m "自动生成自然语音（晓晓/曉臻） [skip ci]"
            git pull --rebase origin main
            git push
          fi
